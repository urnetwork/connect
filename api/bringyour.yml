    PayDataSolanaStatusArgs:
      type: object
      required:
        - reference
      properties:
        reference:
          type: string
    PayDataSolanaStatusResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, paid, expired, unknown]
        item_id:
          type: string
          enum: [data_1tib, data_10tib]
        network_name:
          type: string
        amount_usd:
          type: number
        expires_at:
          type: string
          format: date-time
    StripeCreateCheckoutSessionArgs:
      type: object
      properties:
        item_id:
          type: string
        storefront_country:
          type: string
          description: |
            ISO 3166-1 storefront country, when the caller knows it. The Pro
            items are priced at the caller's regional tier and, when the
            welcome offer is redeemable (yearly only), the 25% coupon is
            applied server-side; the charged tier is finalized from the
            card's billing country once attached.
        ui_mode:
          type: string
          description: |
            "hosted" (default) or "embedded".
          enum:
            - hosted
            - embedded

    StripeCreateCheckoutSessionResult:
      type: object
      properties:
        ui_mode:
          type: string
          description: which of the two shapes below is populated
        checkout_url:
          type: string
          description: hosted mode only
        client_secret:
          type: string
          description: embedded mode only
        publishable_key:
          type: string
          description: embedded mode only
        session_id:
          type: string
          description: both modes; the caller can reconcile the purchase with this
        error:
          type: object
          properties:
            message:
              type: string

    SubscriptionDetailsResult:
      type: object
      properties:
        subscriptions:
          type: array
          description: One entry per store billing the network, ordered by store.
          items:
            type: object
            properties:
              store:
                type: string
                description: stripe | apple | google | solana | manual | x402 | "" (unknown)
              plan:
                type: string
                description: The wire plan value ("supporter"); shown as Pro.
              cadence:
                type: string
                description: yearly | monthly | "" when unknown.
              start_time:
                type: string
                description: datetime, the start of the active window
              end_time:
                type: string
                description: datetime, the expiry or the next renewal date
              auto_renew:
                type: boolean
                nullable: true
                description: The store will bill again at end_time; null when the store lookup failed.
              cancel_at_period_end:
                type: boolean
                description: The store lets the paid period run out and will not bill again.
              can_cancel:
                type: boolean
                description: POST /subscription/cancel acts on this entry (Stripe only).
              manage_url:
                type: string
                description: The store's own subscriptions page (Apple, Google), else empty.
              transaction_id:
                type: string
                description: The store handle for support; invoice id, original transaction id, purchase token or payment reference.
        has_stripe_customer:
          type: boolean
          description: A Stripe customer exists for the network; gate for /stripe/customer-portal.
        update_time:
          type: string
          description: datetime

    SubscriptionCancelArgs:
      type: object
      properties:
        store:
          type: string
          description: The store to act on. "stripe" (default) is the only store the server can cancel.

    SubscriptionCancelResult:
      type: object
      properties:
        store:
          type: string
        end_time:
          type: string
          description: datetime, the end of the paid period (Pro is kept until then)
        auto_renew:
          type: boolean
        manage_url:
          type: string
          description: For a store the server cannot act on, where the customer cancels.
        error:
          type: object
          properties:
            message:
              type: string

    StripeCreateCustomerPortalArgs:
      type: object
      properties: {}

    StripeCreateCustomerPortalResult:
      type: object
      properties:
        url:
          type: string
        error:
          type: object
          properties:
            message:
              type: string
