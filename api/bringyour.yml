        valid_syntax:
          description: The address decodes as ss58 with the Bittensor prefix.
          type: boolean
        exists_on_chain:
          description: The account exists on the subtensor chain (true when the chain could not be reached; see message).
          type: boolean
        banned:
          description: The address is on the operator ban list and must not be attached.
          type: boolean
        message:
          type: string

    AccountEpoch:
      type: object
      properties:
        epoch:
          type: integer
        start_millis:
          description: Epoch window start, unix milliseconds.
          type: integer
        end_millis:
          description: Epoch window end, unix milliseconds.
          type: integer
        points:
          description: Points earned inside the window.
          type: number
          format: double
        share_bps:
          description: The network's share of the operator pool in basis points; 0 when no coldkey was attached.
          type: integer

    AccountEpochsResult:
      type: object
      properties:
        epochs:
          type: array
          items:
            $ref: "#/components/schemas/AccountEpoch"
        error:
          type: object
          properties:
            message:
              type: string

    SnHeadResult:
      type: object
      properties:
        eligible:
          description: The estimate places the network inside the cutoff.
          type: boolean
        score:
          description: Split-adjusted distinct routable egress-IP breadth (server estimate).
          type: number
          format: double
        floor:
          description: Score of the last network inside the cutoff; 0 while fewer networks score.
          type: number
          format: double
        rank_estimate:
          description: 1-based estimated rank; 0 without a score.
          type: integer
        cutoff:
          description: Head-tier size (200).
          type: integer
        bound:
          description: An active head binding exists for one of the network's clients.
          type: boolean
        hotkey:
          description: The bound head hotkey as ss58; absent when not bound.
          type: string
        uid:
          description: The bound uid; 0 when not bound.
          type: integer
        rank:
          description: The bound network's estimated rank; 0 when not bound.
          type: integer
        epoch:
          description: The current contract epoch.
          type: integer
        netuid:
          type: integer
        source:
          description: '"server" (estimate) or "chain" (validator consensus).'
          type: string
        error:
          type: object
          properties:
            message:
              type: string

    SnFleetBinding:
      type: object
      description: |
        protocol.FleetBinding on the wire: 32-byte values as 0x-hex, the
        hotkey as ss58 or 0x-hex, the client id as its uuid. The digest is
        keccak256(domain "urnetwork/fleet-binding/v1" + fields).
      properties:
        chain_id:
          type: integer
        netuid:
          type: integer
        coordinator:
          description: 0x-hex coordinator contract address.
          type: string
        fleet_id:
          type: string
        hotkey:
          type: string
        client_id:
          description: uuid
          type: string
        client_key:
          description: 0x-hex 32-byte client Ed25519 public key.
          type: string
        generation:
          type: integer
        valid_from_epoch:
          type: integer
        valid_to_epoch:
          type: integer
        commitment_hash:
          type: string

    SnHeadBindingArgs:
      type: object
      required:
        - binding
        - client_signature
      properties:
        binding:
          $ref: "#/components/schemas/SnFleetBinding"
        client_signature:
          description: The device's Ed25519 signature (hex) over the binding digest; `signature` is accepted as an alias.
          type: string
        signature:
          type: string
        hotkey_signature:
          description: The head hotkey's sr25519 signature (hex) over the same digest; optional, required for calldata.
          type: string
        hotkey:
          description: Optional override of the binding's hotkey (ss58 or 0x-hex).
          type: string

    SnHeadBindingResult:
      type: object
      properties:
        digest:
          description: 0x-hex keccak256 binding digest.
          type: string
        client_signature_valid:
          type: boolean
        hotkey_signature_valid:
          type: boolean
        ready:
          description: Both signatures verified and calldata is present.
          type: boolean
        calldata:
          description: 0x-hex `bindFleetMember` calldata for the operator to submit.
          type: string
        to:
          description: The coordinator contract address to send the calldata to.
          type: string
        data:
          description: Same as calldata.
          type: string
        contract_address:
          type: string
        chain_id:
          type: integer
        error:
          type: object
          properties:
            message:
              type: string

    SnPoolClaimResult:
      type: object
      properties:
        epoch:
          description: Epoch index.
          type: integer
        no_id:
          description: base64 encoded 32-byte network operator id, as committed on chain.
          type: string
        coldkey:
          description: base64 encoded 32-byte coldkey public key (the ss58-decoded key set via /sn/wallet).
          type: string
        share_bps:
          description: The caller's payout share in basis points.
          type: integer
        proof:
          description: Merkle proof from the (no_id, coldkey, share_bps) leaf to payout_root.
          type: array
          items:
            description: base64 encoded 32-byte node hash.
            type: string
        payout_root:
          description: base64 encoded 32-byte committed payout merkle root.
          type: string
        contract_address:
          description: 0x-hex EVM address of the subnet contract.
          type: string
        chain_id:
          description: EVM chain id of the subnet contract chain.
          type: integer
        claim_open_block:
          description: Block number claims open at.
          type: integer
        error:
          type: object
          properties:
            message:
              type: string

    SnEpochResult:
      type: object
      properties:
        epoch:
          description: Epoch index.
          type: integer
        start_block:
          type: integer
        commit_deadline_block:
          type: integer
        trails_deadline_block:
          type: integer
        finalize_block:
          type: integer
        t_epoch_blocks:
          description: Epoch length in blocks.
          type: integer
        chain_id:
          description: EVM chain id of the subnet contract chain.
          type: integer
        contract_address:
          description: 0x-hex EVM address of the subnet contract.
          type: string
        settlement_vault_address:
          description: 0x-hex EVM address of the settlement vault claims are sent to; absent when unset.
          type: string
        no_id:
          description: The operator id (decimal string); absent when unset.
          type: string
        netuid:
          type: integer
        rpc_url:
          description: Public subtensor EVM JSON-RPC url for clients; absent when unset.
          type: string

    RefreshTokenResult:
      type: object
      properties:
        by_jwt:
          description: The refreshed client JWT.
          type: string
        error:
          type: object
          properties:
            message:
              type: string

    GetClientKeyResult:
      type: object
      properties:
        public_key:
          description: |
            base64 encoded Ed25519 public key for the client id.
            null when the client has never published a key.
          type: string
          nullable: true

    MyIPInfoResult:
