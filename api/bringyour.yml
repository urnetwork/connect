  /pay/data/checkout:
    post:
      description: |
        Buy a data pack with a card without signing in (the ur.io buy-data
        page). Starts a hosted Stripe checkout and returns the url to send the
        customer to. To pay with USDC on Solana use /pay/data/solana-intent.

        With `network_name`, the data is applied to that network by the payment
        webhook as soon as the payment confirms, and the customer is emailed a
        note that the data is on the network (the code is included, already
        applied). The name is matched case-insensitively and exactly; an unknown
        name returns `error.message` "No network named <name>".

        Without `network_name`, the customer receives a data code by email, as
        before. Stripe collects the email on its checkout page when `email` is
        not given.

        The success url is the configured checkout success url plus
        `item=<item_id>` and, when applying to a network, `network=<name>`.
        Unauthenticated, per-ip rate limited. Errors are returned as
        `error.message` with a 200.
      operationId: Pay Data Checkout
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataCheckoutArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataCheckoutResult"

  /pay/data/network-lookup:
    post:
      description: |
        Whether a network with exactly this name exists, for the buy-data page.
        Matched the same way /pay/data/checkout resolves `network_name`
        (case-insensitive, exact). Unlike /auth/network-check, which is a sign-up
        similarity check, a name within a few characters of an existing one is
        NOT reported as existing. Returns only the canonical name, no id.
        Unauthenticated, per-ip rate limited.
      operationId: Pay Data Network Lookup
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataNetworkLookupArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataNetworkLookupResult"

  /pay/data/solana-intent:
    post:
      description: |
        Buy a data pack with USDC on Solana, without signing in or giving an
        email: the data goes straight to the network named by `network_name`
        (matched like /pay/data/network-lookup). Records the payment intent and
        returns the exact `amount_usd` to send in USDC. The client generates
        `reference` (a Solana Pay reference: a fresh base58 public key) and
        either opens a Solana Pay url carrying it, or shows the buyer the
        receiving address, the amount and `memo` (which is the reference) to
        send by hand from any wallet or exchange. The Helius webhook
        (/pay/solana) matches the transfer by the reference among the
        transaction's account keys OR by the memo text, then lands the data on
        the network (data only, valid for one year, no Pro) and emails the
        network's admin when their login is an email.

        The intent expires after 24 hours (`expires_at`); a payment that arrives
        late still credits as long as the intent has not been swept. A reused
        reference, an unknown item or an unknown network return `error.message`
        with a 200. Unauthenticated, per-ip rate limited.
      operationId: Pay Data Solana Intent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataSolanaIntentArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataSolanaIntentResult"

  /pay/data/solana-status:
    post:
      description: |
        The state of a data pack payment started with /pay/data/solana-intent,
        for the buy-data page to poll while it waits: `pending` until the USDC
        transfer is credited, `paid` once the data is on the network, `expired`
        when the intent passed `expires_at` unpaid, `unknown` for a reference
        that is not a data pack intent (plan intents made by a signed-in wallet
        are not reported here). Unauthenticated, per-ip rate limited.
      operationId: Pay Data Solana Status
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataSolanaStatusArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataSolanaStatusResult"

  /stripe/create-checkout-session:
    post:
      description: |
        Create a Stripe Checkout Session for a subscription or data pack.

        `ui_mode` selects which shape the result carries -- a single Stripe
        session cannot produce both:
          - "hosted" (the default, so existing callers are unchanged): returns
            `checkout_url`, which the client opens in a browser.
          - "embedded": returns `client_secret` and `publishable_key`, which the
            client uses to mount Stripe Embedded Checkout inline (the desktop
            apps load ur.io/checkout in a webview with these).

        The subscription is granted by the `invoice.paid` webhook, never by the
        client; the client only polls /subscription/balance afterwards.
      operationId: Stripe Create Checkout Session
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCreateCheckoutSessionArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCreateCheckoutSessionResult"

  /verify:
    post:
      description: |
        One step of the validator's routing-verification protocol.
        The route accepts two body shapes:
        - SEED starts a new trail through the validator-chosen entry provider.
        - EXTEND claims the pending assigned hop of an active trail.
        The request must egress from the provider being claimed - the server
        resolves the hop from the request source IP, never from the body.
        Authentication is the protocol's own Ed25519 signatures (over the
        canonical binary messages, not the JSON), not a JWT.
        A non-final step returns the assign result (the server's signed
        commitment to the next hop); the final step returns status "complete"
        and the published proof.
      operationId: Verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/VerifySeedArgs"
                - $ref: "#/components/schemas/VerifyExtendArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerifyAssignResult"
                  - $ref: "#/components/schemas/VerifyFinalResult"

  /verify/keys:
    get:
      description: |
        The published server Ed25519 verify keys, by server_key_id.
        All historical keys are listed so old proofs remain verifiable
        across key rotations.
      operationId: Verify Keys
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyKeysResult"

  /sn/wallet:
    post:
      description: |
        Attach the caller's subnet coldkey - the ss58 address that pool payouts
        are claimable by. Proof of key possession is required: `message` is the
        single-use challenge issued by POST /auth/wallet-challenge for
        blockchain TAO and `signature` is the coldkey's sr25519 signature over
        it. `client_id` scopes the wallet to one provider client (a
        client-scoped JWT selects its own client). Banned addresses are
        rejected. Not retroactive: the wallet applies from the next committed
        epoch's leaf set. This wallet is deliberately separate from the
        account payout wallet.
      operationId: Sn Set Wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnSetWalletArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnSetWalletResult"
    get:
      description: |
        The coldkeys attached inside the caller's network: the network-level
        wallet (no `client_id`) and every provider client's wallet. `wallet` is
        the session's effective wallet (the client-scoped wallet for a client
        session when set, else the network wallet); absent when none is
        attached. An empty `wallets` list is not an error.
      operationId: Sn Get Wallet
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnGetWalletResult"

  /sn/wallet/validate:
    post:
      description: |
        Checks an address before it is attached: ss58 syntax with the Bittensor
        prefix, the operator ban list, and whether the account exists on the
        subtensor chain. When the chain cannot be reached the result reports
        `exists_on_chain: true` with a message, so an outage never blocks a
        user. No authentication; chain lookups are rate limited per source
        address.
      operationId: Sn Validate Wallet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnValidateWalletArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnValidateWalletResult"

  /sn/head:
    get:
      description: |
        The caller network's standing for a head mining spot (Top 200,
        WHITEPAPER 8.4). `score` is the server's estimate of split-adjusted
        distinct routable egress-IP breadth from the live trail egress index,
        `floor` the score of the last network inside `cutoff` (0 while fewer
        networks score), `rank_estimate` 1-based (0 without a score).
        `bound`/`hotkey`/`uid` reflect an active head binding. `source` is
        "server" until validators publish consensus scores on chain; a chain
        outage degrades to the estimate, never an error.
      operationId: Sn Head
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnHeadResult"

  /sn/head/binding:
    post:
      description: |
        Store a device's consent for a fleet binding (WHITEPAPER 11.4): the
        canonical binding payload and the client's Ed25519 signature over its
        keccak256 digest, optionally with the head hotkey's sr25519 signature.
        When both signatures verify the response carries the
        `bindFleetMember` calldata for the operator to submit from their own
        key. The server never submits on chain.
      operationId: Sn Head Binding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnHeadBindingArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnHeadBindingResult"

  /sn/pool/claim:
    get:
      description: |
        The caller network's merkle pool-payout claim for an epoch:
        everything needed to call claim on the subnet contract.
        Claims are served once the epoch is finalized on chain.
      operationId: Sn Pool Claim
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: epoch
          schema:
            type: integer
          required: true
          description: Epoch index
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnPoolClaimResult"

  /sn/epoch:
    get:
      description: |
        The current subnet epoch index, boundaries, and deadlines mirrored
        from chain, so clients do not need their own RPC.
      operationId: Sn Epoch
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnEpochResult"

  # ----- onboarding program (mmm/onboarding/PLAN.md) -----

  /onboarding/offer/issue:
    post:
      tags: [onboarding]
      summary: Issue the welcome offer
      description: |
        Issue the caller's welcome offer: 25% off the first year of Pro (3
        months free), valid `validity_days` (5) from issue, stacked on the
        14-day trial, redeemable on every store. Issued ONCE per network:
        the call is idempotent and returns the existing offer in whatever
        state it is in (`created: false`); an expired offer is never
        re-issued. Call it the moment the offer surface renders (the intro
        plan step), so the deadline is real.

        Refused with `error` when the onboarding config is absent, or when
        the caller is in the `holdout` variant of the in-app offer
        experiment (`experiments["offer.in_app"]`): those networks show the
        regular plan picker and reach the offer by email instead.

        Budgeted per caller address (30 per 10 minutes): over budget the
        response is 429 with a Retry-After header.
      operationId: onboardingOfferIssue
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingOfferIssueArgs"
            examples:
              introStep:
                summary: The intro plan step renders
                value:
                  surface: intro_step
                  storefront_country: US
      responses:
        "200":
          description: The caller's offer, created now or already issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingOfferIssueResult"
              examples:
                created:
                  summary: Issued by this call
                  value:
                    created: true
                    offer:
                      issued_at: "2026-09-09T16:00:00Z"
                      expires_at: "2026-09-14T16:00:00Z"
                      percent_off: 25
                      months_free: 3
                      first_year_usd: 30
                      regular_year_usd: 40
                      tier: standard
                      currency: USD
                      state: active
                      apple_offer_code: ONBOARD25
                      play_offer_tag: onboarding25
                      stripe_coupon_id: onboarding25
                      redeemed_at: null
                      store: null
                holdout:
                  summary: Refused for the in-app holdout
                  value:
                    created: false
                    offer: null
                    error:
                      message: holdout
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: Too many requests from this address.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"

  /client/events:
    post:
      tags: [analytics]
      summary: Store a batch of product events
      description: |
        Store a batch of product events (at most 200 per call) against the
        CLOSED event schema (see ClientEvent). The network id comes from the
        bearer token only; `country_tier`, path, experiment and variant are
        stamped by the server. Unknown event names, unknown prop keys,
        missing required props and ill-typed values are refused PER EVENT in
        `rejected` (the rest of the batch is stored); a rejection is final,
        the client must not resend that event. No free text is stored except
        `feedback.submitted.text`, which is redacted (emails, phone numbers,
        IP addresses) before storage.

        Clients batch every 30 s or on background, drop an event after three
        failed calls, and never send more than 200 per call (a larger batch
        is a 400). Budgeted per caller address (120 calls per 10 minutes):
        over budget the response is 429 with a Retry-After header.
      operationId: clientEventsSend
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEventsSendArgs"
            examples:
              batch:
                summary: An offer exposure and a purchase start
                value:
                  events:
                    - name: offer.screen.shown
                      at: "2026-09-09T16:00:03Z"
                      platform: android
                      app_version: 2026.9.9
                      locale: en-US
                      session: 3f9c1a
                      props:
                        surface: intro_step
                        experiment: offer_screen
                        variant: control
                        tier: standard
                        price_shown: 29.99
                        currency: USD
                        expires_in_s: 431997
                    - name: purchase.started
                      at: "2026-09-09T16:00:41Z"
                      platform: android
                      app_version: 2026.9.9
                      locale: en-US
                      session: 3f9c1a
                      props:
                        store: play
                        product: supporter-yearly
                        plan: yearly
                        trial: true
                        price: 29.99
                        currency: USD
      responses:
        "200":
          description: Per-event acceptance for the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEventsSendResult"
              examples:
                partial:
                  summary: One event refused
                  value:
                    accepted: 1
                    rejected:
                      - index: 1
                        message: "props.plan: unknown value"
        "400":
          description: More than 200 events in the batch, or a malformed body.
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: Too many event calls from this address.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"

  /onboarding/click:
    post:
      tags: [onboarding, analytics]
      summary: Record a campaign landing click
      description: |
        Record a campaign landing-page click. Every onboarding email link is
        `https://ur.io/o/<step>?t=<token>`; the landing page posts the token
        here, which writes the server-side `landing.clicked` attribution
        event and answers with the in-app destination to route to
        (`onboarding/connect`, `onboarding/widgets`, `onboarding/offer`,
        `onboarding/feedback`). An app open (`/network/auth-client`) within
        48 h of the click is attributed to it as `app.opened`.

        No authentication: the signed token is the credential, and the
        response carries nothing about the network. An expired token still
        returns `step` and `destination` (with `ok: false`,
        `error: expired`) so the page can route without attributing; an
        invalid token returns `ok: false`, `error: invalid`. Budgeted per
        caller address (60 per 10 minutes) -> 429 with Retry-After.
      operationId: onboardingClick
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingClickArgs"
            examples:
              click:
                value:
                  token: eyJzIjoiZTFfY29ubmVjdCIsIm4iOi4uLn0.sig
      responses:
        "200":
          description: The step the link belongs to and where to route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingClickResult"
              examples:
                attributed:
                  value:
                    ok: true
                    step: e1_connect
                    destination: onboarding/connect
                expired:
                  value:
                    ok: false
                    step: e1_connect
                    destination: onboarding/connect
                    error: expired
        "429":
          description: Too many requests from this address.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"

  /onboarding/feedback/{token}:
    get:
      tags: [onboarding]
      summary: Resolve a feedback link token
      description: |
        Resolve a feedback link token (`https://ur.io/f/<token>?r=n` or
        `?why=n`) to the rating or reason the one-tap email button stood
        for, so the in-app feedback screen opens pre-filled. The token
        carries the step and may carry the rating/reason; `r` (1-5) and
        `why` (a reason token) override when present. The app then submits
        the actual feedback through `/feedback/send-feedback` and reports
        `feedback.submitted` through `/client/events`.

        No authentication: the signed token is the credential. Budgeted per
        caller address (60 per 10 minutes) -> 429 with Retry-After.
      operationId: onboardingFeedbackToken
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The signed feedback token from the email link.
          schema:
            type: string
        - name: r
          in: query
          required: false
          description: Rating 1-5 from the tapped button.
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: why
          in: query
          required: false
          description: Reason token from the tapped button.
          schema:
            type: string
      responses:
        "200":
          description: The pre-fill for the feedback screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingFeedbackTokenResult"
              examples:
                rating:
                  value:
                    ok: true
                    step: e4_feedback
                    rating: 4
                    reason: ""
                reason:
                  value:
                    ok: true
                    step: e4_feedback
                    rating: 0
                    reason: did_not_work
        "429":
          description: Too many requests from this address.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"

  /subscription/stripe/payment-sheet:
    post:
      tags: [subscription, onboarding]
      summary: Prepare an inline Stripe payment sheet
      description: |
        Prepare an inline Stripe PaymentSheet purchase of Pro (the non-Play
        Android flavors, Windows and Linux; never the play flavor or
        iOS/macOS). The server creates or reuses the Stripe customer
        (metadata `network_id`) and the subscription at the caller's
        regional tier price: the yearly plan with the 14-day trial and, when
        the caller's welcome offer is redeemable, the 25% coupon applied
        server-side; the monthly plan without a trial. The sheet confirms
        the returned intent: a SetupIntent for the yearly plan
        (`intent_type: setup`, `setup_intent_client_secret`) or the first
        invoice's PaymentIntent for the monthly plan (`intent_type: payment`,
        `payment_intent_client_secret`). Configure the sheet with
        `customer_id`, `ephemeral_key_secret` and `publishable_key`; pass the
        Stripe API version the mobile SDK requires as `stripe_version`.

        The trial is credited only once the card is attached
        (`setup_intent.succeeded`); an abandoned sheet leaves nothing behind.
        The charged tier is finalized from the card's billing country before
        the trial ends and the tier is recorded on the subscription.
        Calling again replaces a pending, unfinished sheet.
      operationId: stripePaymentSheet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripePaymentSheetArgs"
            examples:
              yearly:
                value:
                  plan: yearly
                  stripe_version: "2024-06-20"
      responses:
        "200":
          description: The intent, customer and key material for the sheet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripePaymentSheetResult"
              examples:
                yearlyWithOffer:
                  value:
                    customer_id: cus_123
                    ephemeral_key_secret: ek_test_123
                    setup_intent_client_secret: seti_123_secret_456
                    intent_type: setup
                    subscription_id: sub_123
                    publishable_key: pk_test_123
                    tier: standard
                    currency: USD
                    plan: yearly
                    amount_first_period_usd: 30
                    regular_period_usd: 40
                    trial_days: 14
                    trial_end_at: "2026-09-23T16:00:00Z"
                    offer_applied: true
                    error: null
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: Too many requests from this address.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitedError"

  /subscription/stripe/prices:
    get:
      tags: [subscription, onboarding]
      summary: Stripe prices for the caller's tier
      description: |
        The Stripe price ids (and USD amounts) of the caller's regional tier,
        the publishable key, and the welcome-offer coupon id when the
        caller's offer is redeemable -- for clients that build their own
        Stripe flow (the Windows/Linux Payment Element).
      operationId: stripePrices
      security:
        - BearerAuth: []
      parameters:
        - name: storefront_country
          in: query
          required: false
          description: ISO 3166-1 alpha-2 storefront country, when the app knows it.
          schema:
            type: string
      responses:
        "200":
          description: The tier's price ids and key material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripePricesResult"
              examples:
                standard:
                  value:
                    tier: standard
                    currency: USD
                    yearly_price_id: price_yearly_standard
                    monthly_price_id: price_monthly_standard
                    yearly_usd: 40
                    monthly_usd: 5
                    publishable_key: pk_test_123
                    onboarding_coupon_id: onboarding25
                    offer_eligible: true
                    error: null
        "401":
          description: Missing or invalid bearer token.

  # ----- optimization loop results (mmm/onboarding/PLAN.md, implemented by S3) -----

  /admin/onboarding/results:
    get:
      tags: [analytics]
      summary: Aggregated onboarding experiment results
      description: |
        The nightly aggregate the analysis script (mmm/onboarding/analyze.mjs)
        reads: `onboarding_results_daily`, recomputed at 02:00 UTC by the
        `OnboardingResultsRollup` task for the last `onboarding.results.rollup_days`
        cohort days (config/main/onboarding.yml). One row per cohort day
        (the network's sign-up day, UTC), experiment, variant, surface,
        platform, price tier and path. Counts are networks, never events.

        Exposure is the registry assignment (hash of network id and
        experiment id), so holdout rows exist without any stamped event; for
        the email sequence it is the variant the campaign row was served, and
        only networks with an email address are exposed to an email
        experiment. The pseudo-experiment `_all` (variant `all`, surface
        `all`) counts every network of the cohort so the funnel per platform,
        tier and path is readable without an experiment.

        Column definitions, measured from each network's cohort time:
        `sent`, `delivered`, `opened`, `clicked`, `unsubscribe`, `complaint` =
        at least one `email.*` event of that name, any step;
        `landing_clicked` = a `landing.clicked`; `app_open_48h` = an
        `app.opened` (the auth-client attribution within 48 h of a landing
        click); `connect_7d` = a connection day or `connect.first` within 7
        days; `widget_7d` = `widget.added` within 7 days; `feedback_7d` =
        `feedback.submitted` or an account feedback within 7 days;
        `pro_start_14d` = a `purchase.completed` or the first subscription
        renewal (trial included) within 14 days; `trial_to_paid_35d` =
        `trial.converted` within 35 days; `refund_60d` = a `refund` within
        60 days; `retention_d7` = a connection on day 6 or 7;
        `retention_d30` = a connection on day 28, 29 or 30. A window that has
        not matured reports 0: read `matured_days` (the cohort's age at
        `computed_at`) to tell "not yet" from "did not".

        Volume floor: rows with fewer than `onboarding.results.min_exposures`
        exposures (default 10) are suppressed, and no identifier of any kind
        is returned. Ordered by the dimension tuple; keyset paged by
        `cursor`.

        Auth: `Authorization: Bearer <token>` where the token is listed in
        vault `onboarding.yml` under `onboarding.admin_bearers` (compared in
        constant time). A missing or unknown token is 401; a network JWT is
        403. Without the vault entry the endpoint is closed.
      operationId: adminOnboardingResults
      security:
        - BearerAuth: []
      parameters:
        - name: experiment
          in: query
          required: true
          description: The experiment id from the registry.
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: First cohort day, inclusive (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last cohort day, inclusive (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: surface
          in: query
          required: false
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventPlatform"
        - name: tier
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PriceTierName"
        - name: path
          in: query
          required: false
          description: The campaign path, A (saw the in-app offer) or B.
          schema:
            type: string
            enum: [A, B]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Rows per page, 1-1000 (default 500).
          schema:
            type: integer
      responses:
        "200":
          description: A page of aggregated rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResultsPage"
              examples:
                page:
                  value:
                    rows:
                      - cohort_day: "2026-09-15"
                        experiment: e1_subject_2026w38
                        variant: control
                        surface: email.e1
                        platform: android
                        tier: standard
                        path: A
                        exposures: 412
                        sent: 412
                        delivered: 401
                        opened: 190
                        clicked: 31
                        landing_clicked: 31
                        app_open_48h: 24
                        connect_7d: 19
                        widget_7d: 6
                        feedback_7d: 9
                        pro_start_14d: 5
                        trial_to_paid_35d: 3
                        refund_60d: 0
                        retention_d7: 41
                        retention_d30: 22
                        unsubscribe: 1
                        complaint: 0
                        matured_days: 61
                        computed_at: "2026-11-16T02:00:12Z"
                    next_cursor: null
                    min_exposures: 10
        "400":
          description: Missing experiment, a date not YYYY-MM-DD, `to` before `from`, or an invalid cursor.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The token is a network token, not an admin bearer.

  /admin/onboarding/experiments:
    get:
      tags: [analytics]
      summary: The experiment registry as loaded
      description: |
        The onboarding experiment registry (config/main/onboarding.yml
        `onboarding.experiments`) as the server loaded it, so the analysis
        script judges results against the same allocation, primary metric,
        guardrails and minimum exposures the server applied, plus each
        experiment's live variant states from the pause overlay
        (`network_onboarding_experiment_state`: a variant the nightly
        guardrail check or `bringyourctl onboarding experiments --pause`
        paused is served as `control` until resumed) and the results
        configuration (`min_exposures`, `rollup_days`, `guardrail_days`).
        Same auth as /admin/onboarding/results.
      operationId: adminOnboardingExperiments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The loaded registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingExperimentsResult"
              examples:
                registry:
                  value:
                    experiments:
                      - id: offer_screen
                        surface: offer.in_app
                        status: running
                        start: "2026-09-15"
                        stop: "2026-10-27"
                        allocation:
                          control: 80
                          holdout: 20
                        variants:
                          control: {}
                          holdout: {}
                        primary_metric: pro_start_14d
                        secondary: [trial_to_paid_35d, refund_rate]
                        guardrails:
                          refund_rate: 0.06
                        min_exposures: 3000
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The token is not an admin token.

  /updates/brevo:
    post:
      tags: [analytics]
      summary: Brevo transactional webhook
      description: |
        The Brevo transactional-email webhook. Brevo is registered
        (idempotently, by the server when `onboarding.enabled` is on) to
        post one event per delivery step; the request is authenticated by a
        bearer token from the account's `webhook_bearers` list, not by a
        network token. `unsubscribe` turns the account's product-updates
        preference off (the existing behavior); for the onboarding campaign
        the remaining events are recorded as server-written
        `email.delivered|opened|clicked|bounced|complained|unsubscribed`
        events against the network, with the campaign step taken from the
        message's tag (`onboarding`, `<step>`, `<variant>`) or the
        `X-Mailin-custom` header, so `e1_connect` clicks and `e4b_offer`
        complaints land on the right step. A hard bounce or a complaint
        exits the network from the sequence.
      operationId: brevoWebhook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrevoWebhookArgs"
            examples:
              click:
                value:
                  event: click
                  email: person@example.com
                  message-id: "<202609091600.123@smtp-relay.mailin.fr>"
                  tags: [onboarding, e1_connect, control]
                  link: https://ur.io/o/e1_connect?t=...
                  date: "2026-09-10 09:12:01"
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrevoWebhookResult"
        "401":
          description: The bearer is not one of the account's webhook bearers.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: URnetwork JWT

  schemas:
    ClockResult:
      type: object
      required:
        - total_transfer_byte_count
        - since_block
        - since_time
      properties:
        total_transfer_byte_count:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Base-10 destination-reported bytes for contracts finalized since
            since_block. This is a string so clients do not lose integer
            precision as the lifetime total grows.
        since_block:
          type: integer
          description: First subnet block included in the counter.
        since_time:
          type: string
          format: date-time
          description: UTC start time of since_block.

    ProvideMode:
      type: integer
      oneOf:
        - title: ProvideModeDefault
          const: -1
        - title: ProvideModeNone
          const: 0
        - title: ProvideModeNetwork
          const: 1
        - title: ProvideModeFriendsAndFamily
          const: 2
        - title: ProvideModePublic
          const: 3
        - title: ProvideModeStream
          const: 4

    ProxyClient:
      type: object
      properties:
        change_id:
          type: integer
        create_time:
          description: datetime
          type: string
        proxy_id:
          description: udid
          type: string
        client_id:
          description: udid
          type: string
        api_base_url:
          type: string
        block:
          type: string
        api_port:
          type: integer
        http_proxy_url:
          type: string
        https_proxy_url:
          type: string
        socks_proxy_url:
          type: string
        auth_token:
          type: string
        instance_id:
          description: udid. The instance_id of the proxy device.
          type: string
        proxy_host:
          type: string
        socks_proxy_port:
          type: integer
        http_proxy_port:
          type: integer
        https_proxy_port:
          type: integer
        wg_config:
          type: object
          properties:
            wg_proxy_port:
              type: integer
            client_private_key:
              type: string
            client_public_key:
              type: string
            client_ipv4:
              type: string
            proxy_public_key:
              type: string
            config:
              description: The WireGuard config file for this client.
              type: string

    StatsResult:
      type: object
      properties:
        lookback:
          type: integer
        created_time:
          description: Unix epoch time UTC
          type: integer
        all_transfer_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        all_transfer_summary:
          type: integer
        all_transfer_summary_rate:
          type: integer
        providers_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        providers_summary:
          type: integer
        countries_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        countries_summary:
          type: integer
        regions_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        regions_summary:
          type: integer
        cities_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        cities_summary:
          type: integer
        networks_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        networks_summary:
          type: integer
        devices_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        devices_summary:
