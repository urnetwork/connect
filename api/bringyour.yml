                  type: string
        landmarks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              ip:
                type: string
              url:
                type: string
              rtt:
                type: number
              ws_url:
                type: string
              coordinates:
                type: array
                items:
                  type: number
        connected_to_network:
          type: boolean

    GetNetworkUserResult:
      type: object
      properties:
        network_user:
          type: object
          properties:
            user_id:
              description: udid
              type: string
            user_auth:
              description: email or phone number
