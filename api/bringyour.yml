            auth_type:
              type: string
            network_name:
              type: string
            wallet_address:
              type: string
            user_auths:
              type: array
              items:
                type: object
                properties:
                  user_auth:
                    type: string
                  auth_type:
                    type: string
            sso_auths:
              type: array
