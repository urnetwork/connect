openapi: "3.1.0"
info:
  version: 2026.1.6
  title: URnetwork
  description: |
    URnetwork is a web-standards VPN marketplace with an emphasis on
    fast, secure internet everwhere.

    The API for URnetwork bootstraps the `connect` protocol,
    and is the source of JWTs and other match-making transactions.

    The JWT returned by /auth routes does not have a clientId.
    The `connect` protocol requires a JWT with a clientId.
    Use the /network routes to obtain a JWT with a clientId.

    In URnetwork:
    - a network name is a globally unique subnet (xyz.ur.network)
    - a clientId is a globally unique 16-byte address
    - clientIds are equivalent to IPv6, but are expressed as UDID
    - clients also have an IPv6 and IPv4 mapped to their clientId

    Outside of IP translation like taptun/utun,
    clients are typically addressed via their clientId.

    Unless otherwise specified, time/date strings will be formatted
    in the Go default `2006-01-02 15:04:05.999999999 -0700 MST` (RFC 3339).

    Responses may include additional fields beyond those documented here.
    Clients should ignore unknown fields (be liberal in what you accept).

  termsOfService: https://ur.io/terms
  contact:
    name: URnetwork
    email: support@ur.io
    url: https://ur.io
  x-logo:
    url: https://bringyour.com/res/images/URnetwork-logo-black-400-80.svg
    altText: URnetwork
  license:
    name: Mozilla Public License, v. 2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: https://api.bringyour.com

security:
  - BearerAuth: []

tags:
  - name: onboarding
    description: |
      The new-user onboarding program (mmm/onboarding/PLAN.md): the welcome
      offer, the campaign landing and feedback links, and the sign-up
      preferences the campaign honors.
  - name: analytics
    description: |
      Product events and experiment results behind the onboarding
      optimization loop: the closed client event schema, the experiment
      registry and the aggregated results the analysis script reads.
  - name: subscription
    description: Pro subscriptions, prices and the store purchase paths.

paths:
  /clock:
    get:
      description: |
        Get the cumulative destination-reported bytes for contracts finalized
        on or after the start of subnet block 9.
        The counter advances when contracts reach a final outcome and is
        intended for public clients polling every 1-5 seconds.
      operationId: Clock
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockResult"
        "503":
          description: The clock has not completed its initial block-9 backfill.

  /stats/last-90:
    get:
      description: |
        Get network statistics for the last 90 days.
        The statistics are updated approximately every 60s.
      operationId: Stats Last 90
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResult"

  /stats/providers:
    get:
      description: |
        Get all providers in the caller network.
        Each provider includes stats from the last 24 hours.
      operationId: Stats Providers
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersResult"

  /stats/providers-last-n:
    post:
      description: |
        Get all providers in the caller network.
        Each provider includes stats from the last n hours.
      operationId: Stats Providers Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProvidersArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersResult"

  /stats/provider-last-n:
    post:
      description: |
        Get detailed stats on a single provider in the caller network.
        This is meant to give the user complete visibility over usage.
      operationId: Stats Provider Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProviderArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProviderResult"

  /stats/providers-overview-last-n:
    post:
      description: |
        Get a network-wide time series aggregated across all providers in the
        caller network, over the last n hours.
      operationId: Stats Providers Overview Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProvidersOverviewArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersOverviewResult"

  /stats/leaderboard:
    post:
      description: |
        Fetches top 100 current leaderboard. This data is refreshed every payout.
      operationId: Stats Leaderboard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLeaderboardArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResult"

  /stats/points-leaderboard:
    post:
      description: |
        Page the all-time points leaderboard. Every network with points is
        ranked on three dimensions (total points, finalized epochs with points
        = "blocks", current streak of consecutive finalized epochs with points)
        with competition ranks (1, 2, 2, 4), and every ranked network is
        listed: the pages form one continuous list. A row carries the network
        name only when that network turned on
        /network/points-ranking-visibility (its "show my network name"
        switch); otherwise the row is anonymous. The emoji tag (/network/emoji)
        shows on every row that set one.
        Each sort has its own tie-break order, every key descending, then the
        network id ascending so the order is total: `points` = (points,
        streak, blocks), `blocks` = (blocks, streak, points), `streak` =
        (streak, blocks, points). The pages come in exactly that order, and a
        rank is shared only by networks whose three values all tie.
        Pages use a keyset cursor pinned to a ranking snapshot (rebuilt when an
        epoch finalizes, when a payout plan commits, and hourly); a cursor
        whose snapshot was pruned returns `restart: true` and the client
        reloads from the top. No authentication is required; with a bearer
        token the response also carries `me`, the caller's own row with its
        network name for the caller's own card, whether or not it opted in.
        In the list itself the caller's row is anonymous like everyone
        else's until it opts in: the caller sees what everyone sees, and the
        apps only highlight that row.
      operationId: Stats Points Leaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointsLeaderboardArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsLeaderboardResult"

  /auth/login:
    post:
      description: |
        Start a login for a user authority.
        The user authority may be:
        - email
        - phone number
        - Apple JWT
        - Google JWT
        - a wallet (`wallet_auth`): a Solana or Bittensor signature over the
          single-use challenge from /auth/wallet-challenge. A bound wallet
          returns `network.by_jwt`; an unbound wallet echoes `wallet_auth`
          and the client continues to /auth/network-create with a fresh
          challenge.
        - a seedphrase
      operationId: Auth Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResult"

  /auth/wallet-challenge:
    post:
      description: |
        Issue a single-use wallet sign-in challenge. The wallet signs the
        returned `message_template` byte for byte; the signature is then
        submitted as `wallet_auth` to /auth/login, /auth/network-create or
        /auth/add-auth, each of which consumes one challenge. The message is
        exactly three LF-separated lines: `Sign in to URnetwork`,
        `Challenge: <challenge>` and `Timestamp: <unix seconds>`; the server
        rejects any other text (`400 invalid message format`), a challenge
        that is unknown, expired (5 minutes), already used, issued for another
        blockchain or address, or whose timestamp differs from the issued one.
        Bittensor (TAO) wallets sign with sr25519 in the `substrate` context;
        both the raw text and the polkadot-js `<Bytes>…</Bytes>`-wrapped form
        of the signature verify, and the unwrapped text is what the client
        submits. Rate limited per client address. See server/BITTENSOR-LOGIN.md.
      operationId: Auth Wallet Challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthWalletChallengeArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthWalletChallengeResult"

  /auth/login-with-password:
    post:
      description: |
        Password login for email and phone number.
      operationId: Auth Login With Password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginWithPasswordArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginWithPasswordResult"

  /auth/verify:
    post:
      description: |
        Verify ownership of email or phone number.
      operationId: Auth Verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerifyResult"

  /auth/refresh:
    get:
      description: |
        Refresh the client JWT (by_jwt) for the caller's client.
        Requires a client JWT (from `/network/auth-client`).
      operationId: Auth Refresh Token
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResult"

  /auth/verify-send:
    post:
      description: |
        Send verification code to email or phone number.
      operationId: Auth Verify Send
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifySendArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerifySendResult"

  /auth/password-reset:
    post:
      description: |
        Send password reset code to email or phone number.
      operationId: Auth Password Reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordResetArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPasswordResetResult"

  /auth/password-set:
    post:
      description: |
        Change password.
      operationId: Auth Password Set
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordSetArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPasswordSetResult"

  /auth/network-check:
    post:
      description: |
        Check if the network name is available.
        A new network name must satisfy:
        - at least 3 characters different from an existing network name
        - at least 8 characters
        - domain name compatible (see RFC 5890)
        - not contain the dash (-) character (URnetwork subdomains are reverse-flattened to a single level using dashes)
      operationId: Auth Network Check
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCheckArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkCheckResult"

  /auth/network-create:
    post:
      tags: [onboarding]
      summary: Create a network
      description: |
        Create a new network.
        A user authority can be associated with at most one network.
      operationId: authNetworkCreate
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreateArgs"
      responses:
        "200":
          description: The created network, or the verification/pending state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkCreateResult"
        "400":
          description: The request was malformed, the network name is taken, or the referral code is invalid.

  /auth/network-delete:
    post:
      description: |
        Delete network
      operationId: Auth Network Delete
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDeleteResult"

  /auth/code-create:
    post:
      description: |
        Create a limited use code (auth code) to share authentication
        with connected apps and tools.
        The code is tied to the caller session,
        and will be expired with any of the caller's sessions.
        Currently a code cannot be created for a client JWT
        (from `/network/auth-client`).
        This is a subset of an OAuth flow.
      operationId: Auth Code Create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeCreateArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeCreateResult"

  /auth/apple/callback:
    post:
      tags: [auth]
      summary: Sign in with Apple return for android, windows and linux
      description: |
        Apple has no SDK for android, windows or linux, so those apps open
        Apple's authorize page in the system browser (a Custom Tab on android)
        with `client_id` = the Apple Services ID, `redirect_uri` = this
        endpoint, `response_type=code id_token`, `response_mode=form_post`,
        `scope=name email`, and a fresh `state` and `nonce` per attempt. Apple
        posts the result here as a form, and this endpoint answers `302` to the
        app's own scheme so the browser hands control back to the app:

            <scheme>://oauth/apple?state=…&id_token=…&code=…&user=…
            <scheme>://oauth/apple?state=…&error=…

        `user` is the JSON name/email Apple sends with the first authorization
        only. Nothing is stored or verified here: the app checks that `state`
        is the attempt it started and that the identity token's `nonce` claim
        is the one it minted, then signs in with the token through
        `POST /auth/login` (`auth_jwt_type: apple`), which verifies the
        signature and the audience.

        `state` is opaque except for one optional claim: when it is the
        base64url encoding of a JSON object with a `platform` key, that key
        picks the scheme (`android` → `ur://`, `windows` and `linux` →
        `urnetwork://`); without it the android scheme is used. `GET` with the
        same parameters as a query behaves the same way (manual testing).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  description: The attempt's state, echoed by Apple untouched.
                code:
                  type: string
                  description: Apple's authorization code (unused by the apps, passed through).
                id_token:
                  type: string
                  description: Apple's identity token (a JWT carrying the attempt's nonce).
                user:
                  type: string
                  description: JSON with the user's name and email, first authorization only.
                error:
                  type: string
                  description: Apple's error, e.g. `user_cancelled_authorize`.
      responses:
        '302':
          description: Redirect to the app's `<scheme>://oauth/apple?…` return url.
          headers:
            Location:
              schema:
                type: string
              example: 'ur://oauth/apple?state=eyJwbGF0Zm9ybSI6ImFuZHJvaWQiLCJ0b2tlbiI6IjEyMyJ9&id_token=eyJ...'
        '400':
          description: No `state` in the form, or a body over 64 KiB.
    get:
      tags: [auth]
      summary: Sign in with Apple return (query form, for manual testing)
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: id_token
          schema:
            type: string
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: user
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the app's `<scheme>://oauth/apple?…` return url.
        '400':
          description: No `state`.
  /auth/google/callback:
    get:
      tags: [auth]
      summary: Sign in with Google return for windows and linux
      description: |
        Windows and Linux have no native Google sign-in, so those apps open
        Google's authorize page in the system browser with `client_id` = the
        ur.io web sign-in client, `redirect_uri` = this endpoint,
        `response_type=code`, `scope=openid email profile`,
        `prompt=select_account`, and a fresh `state` and `nonce` per attempt
        (android signs in with play services and ur.io in the page; neither
        uses this). Google redirects the browser here with the authorization
        code; this endpoint exchanges it at Google's token endpoint with the
        web client's secret (vault `google.yml` `sign_in_oauth`) and answers
        `302` to the app's own scheme so the browser hands control back to
        the app:

            <scheme>://oauth/google?state=…&id_token=…
            <scheme>://oauth/google?state=…&error=…

        Nothing is stored. The app checks that `state` is the attempt it
        started and that the identity token's `nonce` claim is the one it
        minted, then signs in with the token through `POST /auth/login`
        (`auth_jwt_type: google`), which verifies the signature and the
        audience.

        `state` is opaque except for the optional `platform` claim shared
        with the Apple callback: base64url JSON with a `platform` key picks
        the scheme (`android` → `ur://`, `windows` and `linux` →
        `urnetwork://`); without it the android scheme is used. Google's own
        `error` (e.g. `access_denied`) is passed through; a failed exchange
        or a missing client configuration comes back as `error` too
        (`not_configured` when the vault has no `sign_in_oauth`).
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: The attempt's state, echoed by Google untouched.
        - in: query
          name: code
          schema:
            type: string
          description: Google's authorization code, exchanged here for the identity token.
        - in: query
          name: error
          schema:
            type: string
          description: Google's error, e.g. `access_denied`.
      responses:
        '302':
          description: Redirect to the app's `<scheme>://oauth/google?…` return url.
          headers:
            Location:
              schema:
                type: string
              example: 'urnetwork://oauth/google?state=eyJwbGF0Zm9ybSI6IndpbmRvd3MiLCJ0b2tlbiI6IjEyMyJ9&id_token=eyJ...'
        '400':
          description: No `state`.
        '405':
          description: Not a `GET`.
  /auth/code-login:
    post:
      description: |
        Authenticate with an auth code.
        The returned session is tied to the session that created the auth code,
        and will be expired with any of the creator's sessions.
        This is a subset of an OAuth flow.
      operationId: Auth Code Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeLoginArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeLoginResult"

  /auth/add-auth:
    post:
      description: |
        Add an authentication method (email/phone + password, SSO, or wallet)
        to the calling user. A wallet (`wallet_auth`, Solana or Bittensor)
        must sign the single-use challenge from /auth/wallet-challenge, the
        same proof as wallet login; one wallet address binds to one user.
        Subject to the account action rate limit.
      operationId: Auth Add Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAuthArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddAuthResult"

  /auth/remove-auth:
    post:
      description: |
        Remove an authentication method from the calling user. The last
        remaining method cannot be removed.
      operationId: Auth Remove Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAuthArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveAuthResult"

  /auth/generate-seedphrase:
    post:
      description: |
        Generate a recovery seedphrase for the calling user. Fails if a
        seedphrase auth already exists; see /auth/regenerate-seedphrase.
      operationId: Auth Generate Seedphrase
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSeedphraseResult"

  /auth/regenerate-seedphrase:
    post:
      description: |
        Replace the calling user's recovery seedphrase with a new one,
        invalidating the previous seedphrase.
      operationId: Auth Regenerate Seedphrase
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateSeedphraseResult"

  /network/auth-client:
    post:
      tags: [onboarding]
      summary: Authenticate a client on the network
      description: |
        Gain permission to use the `connect` protocol as the requested clientId,
        or assign a new clientId.
        Each network can have at most 128 clientIds.
        Above that number, new clientId requests will error until one or more
        existing clientIds are removed.
      operationId: authNetworkClient
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthNetworkClientArgs"
      responses:
        "200":
          description: The client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthNetworkClientResult"
        "401":
          description: Missing or invalid bearer token.

  /network/remove-client:
    post:
      description: |
        Remove a client from the network.
      operationId: Remove Network Client
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveNetworkClientArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveNetworkClientResult"

  /network/clients:
    get:
      description: |
        Get the latest status of the network's devices: every top-level
        client (no source_client_id) that is not a hosted proxy device, with
        no provide-mode qualification. Child clients are never listed, and
        neither are the network's cloud proxy devices (the "resident proxy"
        clients the proxy host runs), which `/network/proxies` lists instead.

        Includes:

        - Resident status, which is the platform counterpart
        for the client that handles control commands.
        - Connections, which are transports from the client to the platform.
        Note there can be multiple active connections for a single client.
        - Provide status

        `proxy_client` is never present on this list.
      operationId: Network Clients
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkClientsResult"

  /network/proxies:
    get:
      description: |
        The network's cloud proxy devices: the clients that carry a hosted
        proxy device (created with `proxy_config` on `/network/auth-client`),
        each with its `proxy_client` credentials (proxy URLs, auth token,
        WireGuard details). Same row shape as `/network/clients` otherwise:
        resident status, connections, provide status.
      operationId: Network Proxies
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkClientsResult"

  /network/peers:
    get:
      description: |
        Fast network peer discovery.

        Lists the currently connected network peers: the top-level clients
        of the network (clients with no source_client_id) and their identity
        metadata (provide modes, principal, roles), plus disconnect markers
        for peers that disconnected within the recent window.

        Allowed for network sessions and top-level client sessions.
        A client session's own client is excluded from the list.
      operationId: Network Peers
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPeersResult"

  /preferences/set-preferences:
    post:
      description: |
        Set account preferences.
      operationId: Preferences Set
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
