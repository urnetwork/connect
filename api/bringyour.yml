    PointsLeaderboardArgs:
      type: object
      properties:
        sort:
          description: The dimension to page by
          type: string
          enum: [points, blocks, streak]
          default: points
        cursor:
          description: |
            Continues a previous page in either direction: a `next_cursor`
            opens the page after it, a `prev_cursor` the page before it.
            Omit for the first page. A cursor is opaque and pins the snapshot
            and the sort; `restart: true` means its snapshot is gone.
          type: string
        seek_rank:
          description: |
            Jumps to a position: the page starts at the row whose `position`
            in this sort's total order equals `seek_rank` (1-based, clamped to
            [1, total_ranked]). Used without a cursor; the response then
            carries both `prev_cursor` and `next_cursor` so the jumped-to
            window pages in both directions. `total_ranked` from any previous
            response is the client's denominator when it turns a scroll
            position into a rank.
          type: integer
          format: int64
          minimum: 1
        limit:
          description: Page size, default 50, max 200
          type: integer

    PointsLeaderboardRow:
      type: object
      properties:
        network_id:
          type: string
        network_name:
          description: Present only when the network turned on points_leaderboard_public (/network/points-ranking-visibility)
          type: string
        emoji_tag:
          description: The network's emoji tag, absent when unset; shown whether or not the name is
          type: string
        anonymous:
          description: true when the network name is hidden; the row is listed either way
          type: boolean
        contains_profanity:
          description: The public name contains profanity (apps may mask it)
          type: boolean
        total_points:
          description: All-time points
          type: number
          format: double
        blocks_with_points:
          description: Finalized epochs in which the network earned points
          type: integer
        streak:
          description: Consecutive finalized epochs with points ending at the latest finalized epoch
          type: integer
        longest_streak:
          description: The best streak ever (informational, never ranked)
          type: integer
        rank_points:
          type: integer
          format: int64
        rank_blocks:
          type: integer
          format: int64
        rank_streak:
          type: integer
          format: int64
        position:
          description: |
            The row's 1-based place in the requested sort's total order.
            Ranks tie (competition ranks), positions never do: this is the
            `seek_rank` coordinate and the key a client keeps its loaded
            window by.
          type: integer
          format: int64
          minimum: 1

    PointsLeaderboardMe:
      allOf:
        - $ref: "#/components/schemas/PointsLeaderboardRow"
        - type: object
          properties:
            points_leaderboard_public:
              type: boolean
            ranked:
              description: false when the network has no points yet
              type: boolean

    PointsLeaderboardResult:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PointsLeaderboardRow"
        next_cursor:
          description: Pages forward from this page's last row; absent on the last page
          type: string
        prev_cursor:
          description: |
            Pages backward from this page's first row; null when the page
            starts at position 1. Present on every page reached by a cursor or
            a `seek_rank`.
          type: [string, "null"]
        restart:
          description: The cursor's snapshot is gone; reload from the top
          type: boolean
        total_ranked:
          description: Networks ranked in the snapshot; every one of them is listed across the pages
          type: integer
          format: int64
        snapshot_time:
          type: string
          format: date-time
        latest_epoch:
          description: The latest finalized epoch the snapshot counts
          type: integer
          format: int64
        me:
          $ref: "#/components/schemas/PointsLeaderboardMe"
        error:
          type: object
          properties:
            message:
              type: string

