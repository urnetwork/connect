    PriceTier:
      type: object
      description: |
        A regional price tier of Pro (config/all/pro.yml pro.price_tiers):
        `standard` ($40/year, $5/month) for the developed-country list,
        `regional` ($4/year, $0.50/month) everywhere else. Prices are USD;
        the store or Stripe shows the local-currency figure. The 14-day
        trial and the welcome offer apply on every tier.
      properties:
        name:
          type: string
          enum:
            - standard
            - regional
        yearly_usd:
          type: number
        monthly_usd:
          type: number
        currency:
          type: string
          description: always USD
        source:
          type: string
          description: how the country was resolved
          enum:
            - storefront
            - billing
            - ip
            - default
        estimate:
          type: boolean
          description: true when the tier is a display estimate (ip or default)

    OnboardingOffer:
      type: object
      description: |
        The welcome offer: `percent_off` (25) off the first year of Pro,
        `months_free` (3) in the store copy, valid until `expires_at`.
        `first_year_usd` / `regular_year_usd` are for the caller's current
        tier ($30 / $40 standard, $3 / $4 regional; the store products show
        $29.99 / $39.99). Redemption handles per store: the App Store offer
        code (`apple_offer_code`, one-time from the batch or the custom
        code), the Play offer tag (`play_offer_tag`, on the yearly base
        plan's discounted first-cycle offer) and the Stripe coupon
        (`stripe_coupon_id`, applied server-side by the checkout and the
        payment sheet); Solana quotes the offer price for plan
        `yearly_onboarding`. Every purchase path stamps `redeemed_at` and
        `store` on the first redemption.
      properties:
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        percent_off:
          type: integer
        months_free:
          type: integer
        first_year_usd:
          type: number
        regular_year_usd:
          type: number
        tier:
          type: string
        currency:
          type: string
        state:
          type: string
          enum:
            - active
            - redeemed
            - expired
        apple_offer_code:
          type: string
        play_offer_tag:
          type: string
        stripe_coupon_id:
          type: string
        redeemed_at:
          description: When the offer was first redeemed; null until then.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        store:
          description: The store of the first redemption; null until then.
          oneOf:
            - $ref: "#/components/schemas/EventStore"
            - type: "null"

    ExperimentAssignment:
      type: object
      description: The caller's variant on one experiment surface.
      properties:
        experiment_id:
          type: string
        variant:
          type: string
          description: a registry variant name; `holdout` means show nothing

    OnboardingOfferIssueArgs:
      type: object
      properties:
        surface:
          $ref: "#/components/schemas/OfferSurface"
        storefront_country:
          type: string
          description: ISO 3166-1 storefront country, when the app knows it

    OfferSurface:
      type: string
      description: Where the offer is shown.
      enum:
        - intro_step
        - final_screen
        - email_link
        - account

    OfferDeclineControl:
      type: string
      enum:
        - free_plan_link
        - back
        - system_dismiss

    OfferPlan:
      type: string
      enum:
        - yearly
        - monthly

    EventStore:
      type: string
      enum:
        - apple
        - play
        - stripe
        - solana

    EventPlatform:
      type: string
      enum:
        - ios
        - macos
        - android
        - web
        - windows
        - linux

    PriceTierName:
      type: string
      enum:
        - standard
        - regional

    RateLimitedError:
      type: object
      description: The body of a 429 response.
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            retry_after_seconds:
              type: integer

    OnboardingOfferIssueResult:
      type: object
      properties:
        offer:
          description: The offer; null when refused.
          oneOf:
            - $ref: "#/components/schemas/OnboardingOffer"
            - type: "null"
        created:
          type: boolean
          description: true for the call that issued the offer
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorMessage"
            - type: "null"

    ErrorMessage:
      type: object
      properties:
        message:
          type: string

    ClientEvent:
      description: |
        One product event. The schema is CLOSED: `name` selects exactly one
        of the variants below and `props` may carry only that variant's
        keys (`additionalProperties: false`). A token is [A-Za-z0-9_.:+-],
        at most 64 characters. Server-written names (landing.clicked,
        app.opened, email.*, trial.*, refund, retention.*) are refused from
        clients.
      oneOf:
        - $ref: "#/components/schemas/ClientEventOnboardingStepShown"
        - $ref: "#/components/schemas/ClientEventOnboardingStepCompleted"
        - $ref: "#/components/schemas/ClientEventOnboardingStepSkipped"
        - $ref: "#/components/schemas/ClientEventOfferScreenShown"
        - $ref: "#/components/schemas/ClientEventOfferCardTapped"
        - $ref: "#/components/schemas/ClientEventOfferCtaTapped"
        - $ref: "#/components/schemas/ClientEventOfferDeclined"
        - $ref: "#/components/schemas/ClientEventPurchaseStarted"
        - $ref: "#/components/schemas/ClientEventPurchaseCompleted"
        - $ref: "#/components/schemas/ClientEventPurchaseCancelled"
        - $ref: "#/components/schemas/ClientEventPurchaseFailed"
        - $ref: "#/components/schemas/ClientEventConnectFirst"
        - $ref: "#/components/schemas/ClientEventWidgetAdded"
        - $ref: "#/components/schemas/ClientEventFeedbackSubmitted"
        - $ref: "#/components/schemas/ClientEventSignupOptoutChanged"
      discriminator:
        propertyName: name
        mapping:
          onboarding.step.shown: "#/components/schemas/ClientEventOnboardingStepShown"
          onboarding.step.completed: "#/components/schemas/ClientEventOnboardingStepCompleted"
          onboarding.step.skipped: "#/components/schemas/ClientEventOnboardingStepSkipped"
          offer.screen.shown: "#/components/schemas/ClientEventOfferScreenShown"
          offer.card.tapped: "#/components/schemas/ClientEventOfferCardTapped"
          offer.cta.tapped: "#/components/schemas/ClientEventOfferCtaTapped"
          offer.declined: "#/components/schemas/ClientEventOfferDeclined"
          purchase.started: "#/components/schemas/ClientEventPurchaseStarted"
          purchase.completed: "#/components/schemas/ClientEventPurchaseCompleted"
          purchase.cancelled: "#/components/schemas/ClientEventPurchaseCancelled"
          purchase.failed: "#/components/schemas/ClientEventPurchaseFailed"
          connect.first: "#/components/schemas/ClientEventConnectFirst"
          widget.added: "#/components/schemas/ClientEventWidgetAdded"
          feedback.submitted: "#/components/schemas/ClientEventFeedbackSubmitted"
          signup.optout_changed: "#/components/schemas/ClientEventSignupOptoutChanged"

    ClientEventBase:
      type: object
      description: The fields every client event carries.
      required: [name]
      properties:
        name:
          type: string
        at:
          type: string
          format: date-time
          description: the client's event time (RFC 3339); missing = now; clamped to [now - 30 d, now]
        platform:
          $ref: "#/components/schemas/EventPlatform"
        app_version:
          $ref: "#/components/schemas/EventToken"
        locale:
          type: string
          maxLength: 32
          description: a locale token (e.g. pt-BR)
        session:
          $ref: "#/components/schemas/EventToken"
          description: an opaque per-app-session token
        props:
          type: object

    EventToken:
      type: string
      pattern: "^[A-Za-z0-9_.:+-]{1,64}$"

    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"

    ClientEventOnboardingStepShown:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: An onboarding step was shown, completed or skipped.
          properties:
            name:
              type: string
              const: onboarding.step.shown
            props:
              type: object
              additionalProperties: false
              required: [step]
              properties:
                step:
                  $ref: "#/components/schemas/EventToken"
                index:
                  type: integer
                elapsed_ms:
                  type: integer

    ClientEventOnboardingStepCompleted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: An onboarding step was shown, completed or skipped.
          properties:
            name:
              type: string
              const: onboarding.step.completed
            props:
              type: object
              additionalProperties: false
              required: [step]
              properties:
                step:
                  $ref: "#/components/schemas/EventToken"
                index:
                  type: integer
                elapsed_ms:
                  type: integer

    ClientEventOnboardingStepSkipped:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: An onboarding step was shown, completed or skipped.
          properties:
            name:
              type: string
              const: onboarding.step.skipped
            props:
              type: object
              additionalProperties: false
              required: [step]
              properties:
                step:
                  $ref: "#/components/schemas/EventToken"
                index:
                  type: integer
                elapsed_ms:
                  type: integer

    ClientEventOfferScreenShown:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The welcome offer was shown on a surface.
          properties:
            name:
              type: string
              const: offer.screen.shown
            props:
              type: object
              additionalProperties: false
              required: [surface]
              properties:
                surface:
                  $ref: "#/components/schemas/OfferSurface"
                experiment:
                  $ref: "#/components/schemas/EventToken"
                variant:
                  $ref: "#/components/schemas/EventToken"
                tier:
                  $ref: "#/components/schemas/PriceTierName"
                price_shown:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"
                expires_in_s:
                  type: integer

    ClientEventOfferCardTapped:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A plan card on the offer screen was tapped.
          properties:
            name:
              type: string
              const: offer.card.tapped
            props:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan:
                  $ref: "#/components/schemas/OfferPlan"

    ClientEventOfferCtaTapped:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The offer screen's primary button was tapped.
          properties:
            name:
              type: string
              const: offer.cta.tapped
            props:
              type: object
              additionalProperties: false
              required: [plan, store]
              properties:
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                store:
                  $ref: "#/components/schemas/EventStore"

    ClientEventOfferDeclined:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The offer screen was left without a purchase.
          properties:
            name:
              type: string
              const: offer.declined
            props:
              type: object
              additionalProperties: false
              required: [control]
              properties:
                control:
                  $ref: "#/components/schemas/OfferDeclineControl"
                elapsed_ms:
                  type: integer

    ClientEventPurchaseStarted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase started, completed or was cancelled.
          properties:
            name:
              type: string
              const: purchase.started
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"

    ClientEventPurchaseCompleted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase started, completed or was cancelled.
          properties:
            name:
              type: string
              const: purchase.completed
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"

    ClientEventPurchaseCancelled:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase started, completed or was cancelled.
          properties:
            name:
              type: string
              const: purchase.cancelled
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"

    ClientEventPurchaseFailed:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase failed.
          properties:
            name:
              type: string
              const: purchase.failed
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"
                error_class:
                  $ref: "#/components/schemas/EventToken"

    ClientEventConnectFirst:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The network's first successful connection (once per network; resends are deduplicated).
          properties:
            name:
              type: string
              const: connect.first
            props:
              type: object
              additionalProperties: false
              properties: {}

    ClientEventWidgetAdded:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A widget, tile or control was added.
          properties:
            name:
              type: string
              const: widget.added
            props:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/EventToken"

    ClientEventFeedbackSubmitted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: In-app feedback was submitted.
          properties:
            name:
              type: string
              const: feedback.submitted
            props:
              type: object
              additionalProperties: false
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                reason:
                  $ref: "#/components/schemas/EventToken"
                has_text:
                  type: boolean
                text:
                  type: string
                  maxLength: 2000
                  description: free text, redacted (emails, phone numbers, IP addresses) before storage

    ClientEventSignupOptoutChanged:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The sign-up form's product-updates line was changed.
          properties:
            name:
              type: string
              const: signup.optout_changed
            props:
              type: object
              additionalProperties: false
              required: [product_updates]
              properties:
                product_updates:
                  type: boolean

    ClientEventsSendArgs:
      type: object
      properties:
        events:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ClientEvent"

    ClientEventsSendResult:
      type: object
      properties:
        accepted:
          type: integer
          description: events stored (or deduplicated)
        rejected:
          type: array
          description: schema refusals by batch index; final, do not resend
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: string

    OnboardingClickArgs:
      type: object
      properties:
        token:
          type: string

    OnboardingClickResult:
      type: object
      properties:
        ok:
          type: boolean
        step:
          type: string
          description: the campaign step the link belongs to (e.g. e1_connect)
        destination:
          type: string
          description: the in-app destination to route to
          enum:
            - onboarding/connect
            - onboarding/widgets
            - onboarding/offer
            - onboarding/feedback
        error:
          type: string
          enum:
            - invalid
            - expired

    OnboardingFeedbackTokenResult:
      type: object
      properties:
        ok:
          type: boolean
        step:
          type: string
        rating:
          type: integer
          description: 1-5, 0 when the link carried none
        reason:
          type: string
        error:
          type: string
          enum:
            - invalid
            - expired

    StripePaymentSheetArgs:
      type: object
      required: [plan]
      properties:
        plan:
          $ref: "#/components/schemas/OfferPlan"
        storefront_country:
          type: string
        stripe_version:
          type: string
          description: the Stripe API version the mobile SDK requires for its ephemeral key

    StripePaymentSheetResult:
      type: object
      properties:
        customer_id:
          type: string
        ephemeral_key_secret:
          type: string
        setup_intent_client_secret:
          type: string
          description: set for intent_type setup (the yearly plan with its trial)
        payment_intent_client_secret:
          type: string
          description: set for intent_type payment (the monthly plan, no trial)
        intent_type:
          type: string
          enum:
            - setup
            - payment
        subscription_id:
          type: string
        publishable_key:
          type: string
        tier:
          type: string
        currency:
          type: string
        plan:
          type: string
        amount_first_period_usd:
          type: number
          description: the first period's price, with the welcome offer applied when eligible
        regular_period_usd:
          type: number
        trial_days:
          type: integer
        trial_end_at:
          type: string
          format: date-time
        offer_applied:
          type: boolean
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorMessage"
            - type: "null"

    StripePricesResult:
      type: object
      properties:
        tier:
          type: string
        currency:
          type: string
        yearly_price_id:
          type: string
        monthly_price_id:
          type: string
        yearly_usd:
          type: number
        monthly_usd:
          type: number
        publishable_key:
          type: string
        onboarding_coupon_id:
          type: string
          description: the welcome-offer coupon, when the caller's offer is redeemable (yearly only)
        offer_eligible:
          type: boolean
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorMessage"
            - type: "null"

    OnboardingResultsRow:
      type: object
      description: |
        One aggregated row of the onboarding results. Counts are networks,
        not events; the fixed-window outcomes are measured from each
        network's cohort time (see GET /admin/onboarding/results for every
        column's definition).
      properties:
        cohort_day:
          type: string
          format: date
        experiment:
          type: string
        variant:
          type: string
        surface:
          type: string
        platform:
          type: string
          description: An EventPlatform, or `unknown` when the sign-up did not say.
        tier:
          type: string
          description: A PriceTierName, or `unknown` when the sign-up country is unknown.
        path:
          type: string
          description: The campaign path A or B, or `unknown`.
        exposures:
          type: integer
        sent:
          type: integer
        delivered:
          type: integer
        opened:
          type: integer
        clicked:
          type: integer
        landing_clicked:
          type: integer
        app_open_48h:
          type: integer
        connect_7d:
          type: integer
        widget_7d:
          type: integer
        feedback_7d:
          type: integer
        pro_start_14d:
          type: integer
        trial_to_paid_35d:
          type: integer
        refund_60d:
          type: integer
        retention_d7:
          type: integer
        retention_d30:
          type: integer
        unsubscribe:
          type: integer
        complaint:
          type: integer
        matured_days:
          type: integer
          description: The cohort's age in whole days at `computed_at`; a window longer than this has not been measured yet.
        computed_at:
          type: string
          format: date-time

    OnboardingResultsPage:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingResultsRow"
        next_cursor:
          description: The cursor for the next page; null on the last page.
          type: [string, "null"]
        min_exposures:
          type: integer
          description: The volume floor applied to this page.

    OnboardingExperiment:
      type: object
      description: One registry entry (config/main/onboarding.yml onboarding.experiments).
      properties:
        id:
          type: string
        surface:
          type: string
          description: email.<step> | offer.in_app | offer.email | cadence
        status:
          type: string
          enum: [draft, running, paused, done]
        start:
          type: string
          format: date
        stop:
          type: string
          format: date
        allocation:
          type: object
          description: percent per variant name, by hash(network_id, id)
          additionalProperties:
            type: number
        variants:
          type: object
          description: per variant, the Brevo template name or the store copy key set and layout id
          additionalProperties:
            type: object
        primary_metric:
          type: string
        secondary:
          type: array
          items:
            type: string
        guardrails:
          type: object
          additionalProperties:
            type: number
        min_exposures:
          type: integer
        active:
          type: boolean
          description: Whether the experiment assigns right now (status running, within start/stop).
        variant_states:
          type: array
          description: The pause overlay rows of this experiment (empty when nothing was ever paused).
          items:
            $ref: "#/components/schemas/OnboardingExperimentVariantState"

    OnboardingExperimentVariantState:
      type: object
      properties:
        experiment_id:
          type: string
        variant:
          type: string
        status:
          type: string
          enum: [paused, running]
          description: paused = served as control; running = resumed.
        reason:
          type: string
        updated_at:
          type: string
          format: date-time

    OnboardingExperimentsResult:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingExperiment"
        results:
          type: object
          description: The results configuration the rollup and the results endpoint apply.
          properties:
            min_exposures:
              type: integer
            rollup_days:
              type: integer
            guardrail_days:
              type: integer

    BrevoWebhookArgs:
      type: object
      description: |
        A Brevo transactional webhook event (https://developers.brevo.com/docs/transactional-webhooks).
        Only the fields the server reads are listed; Brevo sends more.
      required: [event, email]
      properties:
        event:
          type: string
          enum:
            - request
            - delivered
            - opened
            - uniqueOpened
            - click
            - hardBounce
            - softBounce
            - blocked
            - spam
            - complaint
            - unsubscribed
            - unsubscribe
            - invalid
            - deferred
            - error
        email:
          type: string
        message-id:
          type: string
        tags:
          type: array
          description: the send's tags; the campaign sends carry [onboarding, <step>, <variant>]
          items:
            type: string
        tag:
          type: string
          description: Brevo's legacy form of the tags, a JSON-encoded array in a string
        template_id:
          type: integer
        X-Mailin-custom:
          type: string
          description: the campaign sets this header to the step name on every send
        link:
          type: string
          description: the clicked URL (click events)
        date:
          type: string
        ts_event:
          type: integer
          description: unix seconds of the event

    BrevoWebhookResult:
      type: object
      properties: {}

    StatsProvidersArgs:
      type: object
      properties:
        last_n:
          description: n hours
          type: number

    StatsProvidersResult:
      type: object
      properties:
        created_time:
          description: datetime
          type: string
        providers:
          type: array
          items:
            type: object
            properties:
              client_id:
                description: udid
                type: string
              connected:
                type: boolean
              connected_events_last_24h:
                type: array
                items:
                  type: object
                  properties:
                    event_time:
                      description: datetime
                      type: string
                    connected:
                      type: boolean
              uptime_last_24h:
                description: hours up
                type: number
              transfer_data_last_24h:
                description: gib
                type: number
              payout_last_24h:
                description: usdc
                type: number
              search_interest_last_24h:
                description: matching search count
                type: integer
              contracts_last_24h:
                type: integer
              clients_last_24h:
                type: integer
              # provide_mode was speced but never implemented by the live-query
              # stats rework (model.ProviderStats); removed 2026-07-15 to match
              # the implementation (spec conformance test)

    StatsProviderArgs:
      type: object
      properties:
        client_id:
          description: udid
          type: string
        last_n:
          description: n hours
          type: number

    StatsProviderResult:
      type: object
      properties:
        lookback:
          type: integer
        created_time:
          description: datetime
          type: string
        uptime:
          type: object
          description: yyyy-mm-dd-hh (utc) to minutes
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd-hh
            type: number
        transfer_data:
          type: object
          description: yyyy-mm-dd to gib
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: number
        payout:
          type: object
          description: yyyy-mm-dd to payout USDC
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: number
        search_interest:
          type: object
          description: yyyy-mm-dd to matching search count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        contracts:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        clients:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        client_details:
          type: array
          items:
            type: object
            properties:
              client_id:
                description: udid
                type: string
              transfer_data:
                type: object
                description: yyyy-mm-dd to gib
                additionalProperties:
                  x-additionalPropertiesName: yyyy-mm-dd
                  type: number

    StatsProvidersOverviewArgs:
      type: object
      properties:
        last_n:
          description: n hours
          type: number

    StatsProvidersOverviewResult:
      type: object
      properties:
        lookback:
          type: integer
        created_time:
          description: datetime
          type: string
        uptime:
          type: object
