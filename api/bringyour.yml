                $ref: "#/components/schemas/StripeCreateCustomerPortalResult"

  /pay/data/checkout:
    post:
      description: |
        Buy a data pack with a card without signing in (the ur.io buy-data
        page). Starts a hosted Stripe checkout and returns the url to send the
        customer to. To pay with USDC on Solana use /pay/data/solana-intent.

        With `network_name`, the data is applied to that network by the payment
        webhook as soon as the payment confirms, and the customer is emailed a
        note that the data is on the network (the code is included, already
        applied). The name is matched case-insensitively and exactly; an unknown
        name returns `error.message` "No network named <name>".

        Without `network_name`, the customer receives a data code by email, as
        before. Stripe collects the email on its checkout page when `email` is
        not given.

        The success url is the configured checkout success url plus
        `item=<item_id>` and, when applying to a network, `network=<name>`.
        Unauthenticated, per-ip rate limited. Errors are returned as
        `error.message` with a 200.
      operationId: Pay Data Checkout
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataCheckoutArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataCheckoutResult"

  /pay/data/network-lookup:
    post:
      description: |
        Whether a network with exactly this name exists, for the buy-data page.
        Matched the same way /pay/data/checkout resolves `network_name`
        (case-insensitive, exact). Unlike /auth/network-check, which is a sign-up
        similarity check, a name within a few characters of an existing one is
        NOT reported as existing. Returns only the canonical name, no id.
        Unauthenticated, per-ip rate limited.
      operationId: Pay Data Network Lookup
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataNetworkLookupArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataNetworkLookupResult"

  /pay/data/solana-intent:
    post:
      description: |
        Buy a data pack with USDC on Solana, without signing in or giving an
        email: the data goes straight to the network named by `network_name`
        (matched like /pay/data/network-lookup). Records the payment intent and
        returns the exact `amount_usd` to send in USDC. The client generates
        `reference` (a Solana Pay reference: a fresh base58 public key) and
        either opens a Solana Pay url carrying it, or shows the buyer the
        receiving address, the amount and `memo` (which is the reference) to
        send by hand from any wallet or exchange. The Helius webhook
        (/pay/solana) matches the transfer by the reference among the
        transaction's account keys OR by the memo text, then lands the data on
        the network (data only, valid for one year, no Pro) and emails the
        network's admin when their login is an email.

        The intent expires after 24 hours (`expires_at`); a payment that arrives
        late still credits as long as the intent has not been swept. A reused
        reference, an unknown item or an unknown network return `error.message`
        with a 200. Unauthenticated, per-ip rate limited.
      operationId: Pay Data Solana Intent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataSolanaIntentArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataSolanaIntentResult"

  /pay/data/solana-status:
    post:
      description: |
        The state of a data pack payment started with /pay/data/solana-intent,
        for the buy-data page to poll while it waits: `pending` until the USDC
        transfer is credited, `paid` once the data is on the network, `expired`
        when the intent passed `expires_at` unpaid, `unknown` for a reference
        that is not a data pack intent (plan intents made by a signed-in wallet
        are not reported here). Unauthenticated, per-ip rate limited.
      operationId: Pay Data Solana Status
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataSolanaStatusArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataSolanaStatusResult"

  /stripe/create-checkout-session:
    post:
      description: |
        Create a Stripe Checkout Session for a subscription or data pack.

        `ui_mode` selects which shape the result carries -- a single Stripe
        session cannot produce both:
          - "hosted" (the default, so existing callers are unchanged): returns
            `checkout_url`, which the client opens in a browser.
          - "embedded": returns `client_secret` and `publishable_key`, which the
            client uses to mount Stripe Embedded Checkout inline (the desktop
            apps load ur.io/checkout in a webview with these).

        The subscription is granted by the `invoice.paid` webhook, never by the
        client; the client only polls /subscription/balance afterwards.
      operationId: Stripe Create Checkout Session
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCreateCheckoutSessionArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCreateCheckoutSessionResult"

  /verify:
    post:
      description: |
        One step of the validator's routing-verification protocol.
        The route accepts two body shapes:
        - SEED starts a new trail through the validator-chosen entry provider.
        - EXTEND claims the pending assigned hop of an active trail.
        The request must egress from the provider being claimed - the server
        resolves the hop from the request source IP, never from the body.
        Authentication is the protocol's own Ed25519 signatures (over the
        canonical binary messages, not the JSON), not a JWT.
        A non-final step returns the assign result (the server's signed
        commitment to the next hop); the final step returns status "complete"
        and the published proof.
      operationId: Verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/VerifySeedArgs"
                - $ref: "#/components/schemas/VerifyExtendArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerifyAssignResult"
                  - $ref: "#/components/schemas/VerifyFinalResult"

  /verify/keys:
    get:
      description: |
        The published server Ed25519 verify keys, by server_key_id.
        All historical keys are listed so old proofs remain verifiable
        across key rotations.
      operationId: Verify Keys
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyKeysResult"

  /sn/wallet:
    post:
      description: |
        Attach the caller's subnet coldkey - the ss58 address that pool payouts
        are claimable by. Proof of key possession is required: `message` is the
        single-use challenge issued by POST /auth/wallet-challenge for
        blockchain TAO and `signature` is the coldkey's sr25519 signature over
        it. `client_id` scopes the wallet to one provider client (a
        client-scoped JWT selects its own client). Banned addresses are
        rejected. Not retroactive: the wallet applies from the next committed
        epoch's leaf set. This wallet is deliberately separate from the
        account payout wallet.
      operationId: Sn Set Wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnSetWalletArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnSetWalletResult"
    get:
      description: |
        The coldkeys attached inside the caller's network: the network-level
        wallet (no `client_id`) and every provider client's wallet. `wallet` is
        the session's effective wallet (the client-scoped wallet for a client
        session when set, else the network wallet); absent when none is
        attached. An empty `wallets` list is not an error.
      operationId: Sn Get Wallet
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnGetWalletResult"

  /sn/wallet/validate:
    post:
      description: |
        Checks an address before it is attached: ss58 syntax with the Bittensor
        prefix, the operator ban list, and whether the account exists on the
        subtensor chain. When the chain cannot be reached the result reports
        `exists_on_chain: true` with a message, so an outage never blocks a
        user. No authentication; chain lookups are rate limited per source
        address.
      operationId: Sn Validate Wallet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnValidateWalletArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnValidateWalletResult"

  /sn/head:
    get:
      description: |
        The caller network's standing for a head mining spot (Top 200,
        WHITEPAPER 8.4). `score` is the server's estimate of split-adjusted
        distinct routable egress-IP breadth from the live trail egress index,
        `floor` the score of the last network inside `cutoff` (0 while fewer
        networks score), `rank_estimate` 1-based (0 without a score).
        `bound`/`hotkey`/`uid` reflect an active head binding. `source` is
        "server" until validators publish consensus scores on chain; a chain
        outage degrades to the estimate, never an error.
      operationId: Sn Head
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnHeadResult"

  /sn/head/binding:
    post:
      description: |
        Store a device's consent for a fleet binding (WHITEPAPER 11.4): the
        canonical binding payload and the client's Ed25519 signature over its
        keccak256 digest, optionally with the head hotkey's sr25519 signature.
        When both signatures verify the response carries the
        `bindFleetMember` calldata for the operator to submit from their own
        key. The server never submits on chain.
      operationId: Sn Head Binding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnHeadBindingArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnHeadBindingResult"

  /sn/pool/claim:
    get:
      description: |
        The caller network's merkle pool-payout claim for an epoch:
        everything needed to call claim on the subnet contract.
        Claims are served once the epoch is finalized on chain.
      operationId: Sn Pool Claim
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: epoch
          schema:
            type: integer
          required: true
          description: Epoch index
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnPoolClaimResult"

  /sn/epoch:
    get:
      description: |
        The current subnet epoch index, boundaries, and deadlines mirrored
        from chain, so clients do not need their own RPC.
      operationId: Sn Epoch
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnEpochResult"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: URnetwork JWT

  schemas:
    ClockResult:
      type: object
      required:
        - total_transfer_byte_count
        - since_block
        - since_time
      properties:
        total_transfer_byte_count:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Base-10 destination-reported bytes for contracts finalized since
            since_block. This is a string so clients do not lose integer
            precision as the lifetime total grows.
        since_block:
          type: integer
          description: First subnet block included in the counter.
        since_time:
          type: string
          format: date-time
          description: UTC start time of since_block.

    ProvideMode:
      type: integer
      oneOf:
        - title: ProvideModeDefault
          const: -1
        - title: ProvideModeNone
          const: 0
        - title: ProvideModeNetwork
          const: 1
        - title: ProvideModeFriendsAndFamily
          const: 2
        - title: ProvideModePublic
          const: 3
        - title: ProvideModeStream
          const: 4

    ProxyClient:
      type: object
      properties:
        change_id:
          type: integer
        create_time:
          description: datetime
          type: string
        proxy_id:
          description: udid
          type: string
        client_id:
          description: udid
          type: string
        api_base_url:
          type: string
        block:
          type: string
        api_port:
          type: integer
        http_proxy_url:
          type: string
        https_proxy_url:
          type: string
        socks_proxy_url:
          type: string
        auth_token:
          type: string
        instance_id:
          description: udid. The instance_id of the proxy device.
          type: string
        proxy_host:
          type: string
        socks_proxy_port:
          type: integer
        http_proxy_port:
          type: integer
        https_proxy_port:
          type: integer
        wg_config:
          type: object
          properties:
            wg_proxy_port:
              type: integer
            client_private_key:
              type: string
            client_public_key:
              type: string
            client_ipv4:
              type: string
            proxy_public_key:
              type: string
            config:
              description: The WireGuard config file for this client.
              type: string

    StatsResult:
      type: object
      properties:
        lookback:
          type: integer
        created_time:
          description: Unix epoch time UTC
          type: integer
        all_transfer_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        all_transfer_summary:
          type: integer
        all_transfer_summary_rate:
          type: integer
        providers_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        providers_summary:
          type: integer
        countries_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        countries_summary:
          type: integer
        regions_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        regions_summary:
          type: integer
        cities_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        cities_summary:
          type: integer
        networks_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        networks_summary:
          type: integer
        devices_data:
          type: object
          description: yyyy-mm-dd to count
          additionalProperties:
            x-additionalPropertiesName: yyyy-mm-dd
            type: integer
        devices_summary:
          type: integer

    AuthLoginArgs:
      type: object
      properties:
        user_auth:
          description: email or phone number
          type: string
        auth_jwt:
          type: string
        auth_jwt_type:
          type: string
          enum:
            - apple
            - google
        wallet_auth:
          $ref: "#/components/schemas/WalletAuthArgs"

    AuthLoginResult:
      type: object
      properties:
        user_name:
          type: string
        user_auth:
          description: email or phone number
          type: string
        auth_allowed:
          type: array
          items:
            type: string
            enum:
              - password
              - apple
              - google
        error:
          type: object
          properties:
            suggested_user_auth:
              type: string
              enum:
                - password
                - apple
                - google
            message:
              type: string
        network:
          type: object
          properties:
            by_jwt:
              type: string
        wallet_auth:
          $ref: "#/components/schemas/WalletAuthArgs"

    AuthLoginWithPasswordArgs:
      type: object
      properties:
        user_auth:
          description: email or phone number
          type: string
        password:
          type: string
        verify_otp_numeric:
          type: boolean

    AuthLoginWithPasswordResult:
      type: object
      properties:
        verification_required:
          type: object
          properties:
            user_auth:
              description: email or phone number
              type: string
        network:
          type: object
          properties:
            by_jwt:
              type: string
            name:
              type: string
        error:
          type: object
          properties:
            message:
              type: string

    AuthVerifyArgs:
      type: object
      properties:
        user_auth:
          description: email or phone number
          type: string
        verify_code:
          type: string

    AuthVerifyResult:
      type: object
      properties:
        network:
          type: object
          properties:
            by_jwt:
              type: string
        error:
          type: object
          properties:
            message:
              type: string

    AuthVerifySendArgs:
      type: object
      properties:
        user_auth:
          description: email or phone number
          type: string
        use_numeric:
          description: optionally create a numeric 6 digit code instead of the default 8 digit
          type: boolean

    AuthVerifySendResult:
      type: object
      properties:
        user_auth:
          description: email or phone number
          type: string

    AuthPasswordResetArgs:
      type: object
      properties:
        user_auth:
          description: email or phone number
          type: string

    AuthPasswordResetResult:
      type: object
      properties:
        user_auth:
          description: email or phone number
          type: string

    AuthPasswordSetArgs:
      type: object
      properties:
        reset_code:
          type: string
        password:
          type: string

    AuthPasswordSetResult:
      type: object
      properties: {}

    NetworkCheckArgs:
      type: object
      properties:
        network_name:
          type: string

    NetworkCheckResult:
      type: object
      properties:
        available:
          type: boolean

    NetworkCreateArgs:
      type: object
      properties:
        user_name:
          type: string
        user_auth:
          description: email or phone number
          type: string
        auth_jwt:
          type: string
        auth_jwt_type:
          type: string
          enum:
            - apple
            - google
        password:
          type: string
        network_name:
          type: string
        terms:
          description: user consent to accept terms of service
          type: boolean
        verify_use_numeric:
          type: boolean
        wallet_auth:
          $ref: "#/components/schemas/WalletAuthArgs"
        referral_code:
          type: string
          description: Optional referral code of the network that referred this new network.
        balance_code:
          type: string
          description: Optional balance code to add transfer balance to the new network.

    NetworkCreateResult:
      type: object
      properties:
        network:
          type: object
          properties:
            by_jwt:
              type: string
            network_id:
              description: uuid
              type: string
            network_name:
              type: string
            is_pro:
              type: boolean
        user_auth:
          description: email or phone number
          type: string
        is_pro:
          type: boolean
        verification_required:
          type: object
          properties:
            user_auth:
              description: email or phone number
              type: string
        error:
          type: object
          properties:
            message:
              type: string

    NetworkDeleteResult:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string

    AuthCodeCreateArgs:
      type: object
      properties:
        duration_minutes:
          type: number
        uses:
          type: integer
        roles:
          description: Optional. |
            Identity roles carried by logins minted from this code. |
            Only a network session may set these. The values have no meaning to the network.
          type: array
          items:
            type: string
        principal:
          description: Optional. |
            Identity principal carried by logins minted from this code. |
            Only a network session may set this.
          type: string

    AuthCodeCreateResult:
      type: object
      properties:
        auth_code:
          type: string
        duration_minutes:
          type: number
        uses:
          type: integer
        error:
          type: object
          properties:
            auth_code_limit_exceeded:
              type: boolean
            message:
              type: string

    AuthCodeLoginArgs:
      type: object
      properties:
        auth_code:
          type: string

    AuthCodeLoginResult:
      type: object
      properties:
        by_jwt:
          type: string
        error:
          type: object
          properties:
            message:
              type: string

    AuthNetworkClientArgs:
      type: object
      properties:
        client_id:
          description: udid. Optional. If this is given, it must currently exist in the network. Omit this to assign a new client id.
          type: string
        source_client_id:
          description: udid. Optional. The source client id when creating an ancillary client id.
          type: string
        description:
          description: If this is a new device, sets the device name to the description of the device.
          type: string
        device_spec:
          description: If this is a new device, sets the device spec.
          type: string
        roles:
          description: Optional. |
            Identity roles assigned to the client at creation, immutable after. |
            Only a network session may set these; when omitted, the session's own roles are inherited. |
            The values have no meaning to the network.
          type: array
          items:
            type: string
        principal:
          description: Optional. |
            Identity principal assigned to the client at creation, immutable after. |
            Only a network session may set this; when omitted, the session's own principal is inherited.
          type: string
        # the proxy auth will be the by_client_jwt as username, no password
        proxy_config:
          description: Optional. |
            Set if the intended use case of the client is cloud proxy. |
            Note local traffic is not allowed on the cloud proxy. A destination must be set via the SDK.
          type: object
          properties:
            lock_caller_ip:
              description: Optional. |
                Allow only the caller's IP subnet to access the proxy.
              type: boolean
            lock_ip_list:
              description: Optional. |
                Allow only IPs/subnets in the list to access the proxy. |
                The IPs/subnets are converted to the internal IP subnet width.
              type: array
              items:
                type: string
            https_require_auth:
              description: Optional. |
                If the client supports ECH, this is not needed, since the HTTP proxy URL will itself be the auth.
              type: boolean
            enable_wg:
              description: Optional. |
                If enabled, a WireGuard configuration will be created for the proxy.
              type: boolean
            initial_device_state:
              description: Optional. |
                Whenever the device is created, it will be set up with this initial state.
                To configure the device beyond the initial state, the SDK ProxyDevice must be used.
                Note that the SDK ProxyDevice must reconfigure the device each time it receives a change notice.
              type: object
              properties:
                country_code:
                  description: Optional. Use one of country_code or location
                  type: string
                location:
                  description: Optional. Use one of country_code or location
                  type: object
                  properties:
                    connect_location_id:
                      type: object
                      properties:
                        client_id:
                          description: udid. Optional.
                          type: string
                        location_id:
                          description: udid. Optional.
                          type: string
                        location_group_id:
                          description: udid. Optional.
                          type: string
                        best_available:
                          description: udid. Optional.
                          type: boolean
                    name:
                      type: string
                    location_type:
                      type: string
                      oneOf:
                        - title: LocationTypeCountry
                          const: country
                        - title: LocationTypeRegion
                          const: region
                        - title: LocationTypeCity
                          const: city
                performance_profile:
                  type: object
                  properties:
                    window_type:
                      description: Optional. The default is "quality"
                      type: string
                      oneOf:
                        - title: WindowTypeQuality
                          const: quality
                        - title: WindowTypeSpeed
                          const: speed
                    window_size:
                      type: object
                      properties:
                        window_size_min:
                          type: integer
                        window_size_min_p2p_only:
                          description: |
                            The minimumum number of items in the windows that must be connected via p2p only.
                            Leave 0 for default behavior.
                          type: integer
                        window_size_max:
                          description: Inclusive, soft limit. |
                            When `window_size_max==window_size_min`, a special fixed size mode is enabled.
                          type: integer
                        window_size_hard_max:
                          description: Leave 0 to disable (no hard limit)
                          type: integer
                        window_size_reconnect_scale:
                          description: Clients per source per stream
                          type: number
                        keep_healthiest_count:
                          description: Leave 0 to disable
                          type: integer
                        ulimit:
                          description: Leave 0 to disable (no limit)
                          type: integer

    AuthNetworkClientResult:
      type: object
      properties:
        by_client_jwt:
          type: string
        client_id:
          description: udid
          type: string
        # the returned proxy urls are valid as long as the client is not removed
        proxy_config_result:
          description: |
            The following proxy URLs and auths may be used:
            | URL | Auth |
            |-----|------|
            | https://<auth_token>.<proxy_host>:<https_proxy_port> | no auth needed when the client connects with TLS |
            | https://<proxy_host>:<https_proxy_port> | use HTTP Proxy-Authorization Basic with `access_token` as the username (empty pass), or Bearer with `access_token` as the bearer token |
            | http://<proxy_host>:<http_proxy_port> | use HTTP Proxy-Authorization Basic with `access_token` as the username (empty pass), or Bearer with `access_token` as the bearer token |
            | tcp://<proxy_host>:<socks_proxy_port> | use `access_token` as the username (empty pass) |
            | wg://<proxy_host>:<wg_proxy_port> | use `wg_config.config` as the full WireGuard config file content, which contains all the necessary keys |
          allOf:
            - type: object
              properties:
                keepalive_seconds:
                  description: |
                    The proxy url will be valid until the client is removed.
                    However, to keep the device and state in memory,
                    the proxy must receive a message at least once per this interval.
                    The SDK ProxyDevice will automatically send a heartbeat with this many seconds.
                    If the proxy is removed from memmory, the next call to the proxy will
                    create a new device set up to the `initial_device_state` (if present).
                  type: integer
            - $ref: "#/components/schemas/ProxyClient"

        error:
          type: object
          properties:
            client_limit_exceeded:
              type: boolean
            message:
              type: string

