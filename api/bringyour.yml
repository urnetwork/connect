      description: |
        Fetch the published Ed25519 public key for a client id.
        Unauthenticated by design - the value is a public key meant to be
        fetchable by any peer. A client that has never published a key
        returns `{"public_key": null}` with HTTP 200.
      operationId: Get Client Key
      security: []
      parameters:
        - in: path
          name: clientId
          schema:
            type: string
          required: true
          description: udid. The client id to look up.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClientKeyResult"

  /hello:
    get:
      description: |
        Simple hello to the network that returns some useful information.
        This can be used for discovery.
      operationId: Hello
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResult"

