                    type: string
            wallet_auths:
              type: array
              items:
                type: object
                properties:
                  user_id:
                    description: udid
                    type: string
                  wallet_address:
                    type: string
                  blockchain:
                    type: string
        error:
          type: object
          properties:
            message:
              type: string

    UpdateNetworkNameArgs:
      type: object
      properties:
        network_name:
          type: string

    UpdateNetworkNameResult:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string

    VerifySeekerNftHolderArgs:
      type: object
      properties:
        wallet_address:
          description: The wallet public key
          type: string
        wallet_signature:
          type: string
        wallet_message:
          description: The signed message
          type: string

    VerifySeekerNftHolderResult:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            message:
              type: string

    UploadLogFileResult:
      type: object
      properties: {}

    StripePaymentIntent:
      type: object
      properties:
        subscription_type:
          type: string
        client_secret:
          type: string

    StripeCreatePaymentIntentArgs:
      type: object
      properties: {}

    StripeCreatePaymentIntentResult:
      type: object
      properties:
        payment_intents:
          type: array
          items:
            $ref: "#/components/schemas/StripePaymentIntent"
        ephemeral_key:
          type: string
        customer_id:
          type: string
        publishable_key:
          type: string
        error:
          type: object
          properties:
            message:
              type: string

    PayDataCheckoutArgs:
      type: object
      required:
        - item_id
        - provider
      properties:
        item_id:
          type: string
          enum: [data_1tib, data_10tib]
        provider:
          type: string
          enum: [stripe]
          description: the hosted checkout; empty means stripe
        network_name:
          type: string
          description: the network that receives the data; omit to receive a code by email
        email:
          type: string
          description: where the code (or the applied note) is sent; Stripe collects it at checkout when omitted
    PayDataCheckoutResult:
      type: object
      properties:
        url:
          type: string
          description: the hosted checkout url to send the customer to
        provider:
          type: string
          enum: [stripe]
        network_id:
          type: string
          format: uuid
          description: the resolved network when network_name was given
        error:
          type: object
          properties:
            message:
              type: string
    PayDataNetworkLookupArgs:
      type: object
      required:
        - network_name
      properties:
        network_name:
          type: string
    PayDataNetworkLookupResult:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
        network_name:
          type: string
          description: the name as stored, when it exists
    PayDataSolanaIntentArgs:
      type: object
      required:
        - item_id
        - network_name
        - reference
      properties:
        item_id:
          type: string
          enum: [data_1tib, data_10tib]
        network_name:
          type: string
          description: the network that receives the data
        reference:
          type: string
          description: |
            the Solana Pay reference the client generated (a fresh base58 public
            key); it doubles as the transfer memo for a payment sent by hand
    PayDataSolanaIntentResult:
      type: object
      properties:
        amount_usd:
          type: number
          description: the exact amount to send, in USDC
        reference:
          type: string
        memo:
          type: string
          description: the transfer memo for a payment sent by hand (the reference)
        expires_at:
          type: string
          format: date-time
        network_name:
          type: string
          description: the resolved network name, as stored
        network_id:
          type: string
          format: uuid
        error:
          type: object
          properties:
            message:
              type: string
    PayDataSolanaStatusArgs:
      type: object
      required:
        - reference
      properties:
        reference:
          type: string
    PayDataSolanaStatusResult:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, paid, expired, unknown]
        item_id:
          type: string
          enum: [data_1tib, data_10tib]
        network_name:
          type: string
        amount_usd:
          type: number
        expires_at:
          type: string
          format: date-time
    StripeCreateCheckoutSessionArgs:
      type: object
      properties:
        item_id:
          type: string
        ui_mode:
          type: string
          description: |
            "hosted" (default) or "embedded".
          enum:
            - hosted
            - embedded

    StripeCreateCheckoutSessionResult:
      type: object
      properties:
        ui_mode:
          type: string
          description: which of the two shapes below is populated
        checkout_url:
          type: string
          description: hosted mode only
        client_secret:
          type: string
          description: embedded mode only
        publishable_key:
          type: string
          description: embedded mode only
        session_id:
          type: string
          description: both modes; the caller can reconcile the purchase with this
        error:
          type: object
          properties:
            message:
              type: string

    SubscriptionDetailsResult:
      type: object
      properties:
        subscriptions:
          type: array
          description: One entry per store billing the network, ordered by store.
          items:
            type: object
            properties:
              store:
                type: string
                description: stripe | apple | google | solana | manual | x402 | "" (unknown)
              plan:
                type: string
                description: The wire plan value ("supporter"); shown as Pro.
              cadence:
                type: string
                description: yearly | monthly | "" when unknown.
              start_time:
                type: string
                description: datetime, the start of the active window
              end_time:
                type: string
                description: datetime, the expiry or the next renewal date
              auto_renew:
                type: boolean
                nullable: true
                description: The store will bill again at end_time; null when the store lookup failed.
              cancel_at_period_end:
                type: boolean
                description: The store lets the paid period run out and will not bill again.
              can_cancel:
                type: boolean
                description: POST /subscription/cancel acts on this entry (Stripe only).
              manage_url:
                type: string
                description: The store's own subscriptions page (Apple, Google), else empty.
              transaction_id:
                type: string
                description: The store handle for support; invoice id, original transaction id, purchase token or payment reference.
        has_stripe_customer:
          type: boolean
          description: A Stripe customer exists for the network; gate for /stripe/customer-portal.
        update_time:
          type: string
          description: datetime

    SubscriptionCancelArgs:
      type: object
      properties:
        store:
          type: string
          description: The store to act on. "stripe" (default) is the only store the server can cancel.

    SubscriptionCancelResult:
      type: object
      properties:
        store:
          type: string
        end_time:
          type: string
          description: datetime, the end of the paid period (Pro is kept until then)
        auto_renew:
          type: boolean
        manage_url:
          type: string
          description: For a store the server cannot act on, where the customer cancels.
        error:
          type: object
          properties:
            message:
              type: string

    StripeCreateCustomerPortalArgs:
      type: object
      properties: {}

    StripeCreateCustomerPortalResult:
      type: object
      properties:
        url:
          type: string
        error:
          type: object
          properties:
            message:
              type: string
