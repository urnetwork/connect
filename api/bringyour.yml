openapi: "3.1.0"
info:
  version: 2026.1.6
  title: URnetwork
  description: |
    URnetwork is a web-standards VPN marketplace with an emphasis on
    fast, secure internet everwhere.

    The API for URnetwork bootstraps the `connect` protocol,
    and is the source of JWTs and other match-making transactions.

    The JWT returned by /auth routes does not have a clientId.
    The `connect` protocol requires a JWT with a clientId.
    Use the /network routes to obtain a JWT with a clientId.

    In URnetwork:
    - a network name is a globally unique subnet (xyz.ur.network)
    - a clientId is a globally unique 16-byte address
    - clientIds are equivalent to IPv6, but are expressed as UDID
    - clients also have an IPv6 and IPv4 mapped to their clientId

    Outside of IP translation like taptun/utun,
    clients are typically addressed via their clientId.

    Unless otherwise specified, time/date strings will be formatted
    in the Go default `2006-01-02 15:04:05.999999999 -0700 MST` (RFC 3339).

    Responses may include additional fields beyond those documented here.
    Clients should ignore unknown fields (be liberal in what you accept).

  termsOfService: https://ur.io/terms
  contact:
    name: URnetwork
    email: support@ur.io
    url: https://ur.io
  x-logo:
    url: https://bringyour.com/res/images/URnetwork-logo-black-400-80.svg
    altText: URnetwork
  license:
    name: Mozilla Public License, v. 2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: https://api.bringyour.com

security:
  - BearerAuth: []

paths:
  /clock:
    get:
      description: |
        Get the cumulative destination-reported bytes for contracts finalized
        on or after the start of subnet block 9.
        The counter advances when contracts reach a final outcome and is
        intended for public clients polling every 1-5 seconds.
      operationId: Clock
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockResult"
        "503":
          description: The clock has not completed its initial block-9 backfill.

  /stats/last-90:
    get:
      description: |
        Get network statistics for the last 90 days.
        The statistics are updated approximately every 60s.
      operationId: Stats Last 90
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResult"

  /stats/providers:
    get:
      description: |
        Get all providers in the caller network.
        Each provider includes stats from the last 24 hours.
      operationId: Stats Providers
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersResult"

  /stats/providers-last-n:
    post:
      description: |
        Get all providers in the caller network.
        Each provider includes stats from the last n hours.
      operationId: Stats Providers Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProvidersArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersResult"

  /stats/provider-last-n:
    post:
      description: |
        Get detailed stats on a single provider in the caller network.
        This is meant to give the user complete visibility over usage.
      operationId: Stats Provider Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProviderArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProviderResult"

  /stats/providers-overview-last-n:
    post:
      description: |
        Get a network-wide time series aggregated across all providers in the
        caller network, over the last n hours.
      operationId: Stats Providers Overview Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProvidersOverviewArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersOverviewResult"

  /stats/leaderboard:
    post:
      description: |
        Fetches top 100 current leaderboard. This data is refreshed every payout.
      operationId: Stats Leaderboard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLeaderboardArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResult"

  /stats/points-leaderboard:
    post:
      description: |
        Page the all-time points leaderboard. Every network with points is
        ranked on three dimensions (total points, finalized epochs with points
        = "blocks", current streak of consecutive finalized epochs with points)
        with competition ranks (1, 2, 2, 4); only networks that opted in
        (/network/points-ranking-visibility) are listed, so ranks have gaps.
        Pages use a keyset cursor pinned to a ranking snapshot (rebuilt when an
        epoch finalizes, when a payout plan commits, and hourly); a cursor
        whose snapshot was pruned returns `restart: true` and the client
        reloads from the top. No authentication is required; with a bearer
        token the response also carries `me`, the caller's own row whether or
        not it opted in.
      operationId: Stats Points Leaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointsLeaderboardArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsLeaderboardResult"

  /auth/login:
    post:
      description: |
        Start a login for a user authority.
        The user authority may be:
        - email
        - phone number
        - Apple JWT
        - Google JWT
      operationId: Auth Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResult"

  /auth/login-with-password:
    post:
      description: |
        Password login for email and phone number.
      operationId: Auth Login With Password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginWithPasswordArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginWithPasswordResult"

  /auth/verify:
    post:
      description: |
        Verify ownership of email or phone number.
      operationId: Auth Verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerifyResult"

  /auth/refresh:
    get:
      description: |
        Refresh the client JWT (by_jwt) for the caller's client.
        Requires a client JWT (from `/network/auth-client`).
      operationId: Auth Refresh Token
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResult"

  /auth/verify-send:
    post:
      description: |
        Send verification code to email or phone number.
      operationId: Auth Verify Send
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifySendArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthVerifySendResult"

  /auth/password-reset:
    post:
      description: |
        Send password reset code to email or phone number.
      operationId: Auth Password Reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordResetArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPasswordResetResult"

  /auth/password-set:
    post:
      description: |
        Change password.
      operationId: Auth Password Set
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthPasswordSetArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPasswordSetResult"

  /auth/network-check:
    post:
      description: |
        Check if the network name is available.
        A new network name must satisfy:
        - at least 3 characters different from an existing network name
        - at least 8 characters
        - domain name compatible (see RFC 5890)
        - not contain the dash (-) character (URnetwork subdomains are reverse-flattened to a single level using dashes)
      operationId: Auth Network Check
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCheckArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkCheckResult"

  /auth/network-create:
    post:
      description: |
        Create a new network.
        A user authority can be associated with at most one network.
      operationId: Auth Network Create
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreateArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkCreateResult"

  /auth/network-delete:
    post:
      description: |
        Delete network
      operationId: Auth Network Delete
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkDeleteResult"

  /auth/code-create:
    post:
      description: |
        Create a limited use code (auth code) to share authentication
        with connected apps and tools.
        The code is tied to the caller session,
        and will be expired with any of the caller's sessions.
        Currently a code cannot be created for a client JWT
        (from `/network/auth-client`).
        This is a subset of an OAuth flow.
      operationId: Auth Code Create
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeCreateArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeCreateResult"

  /auth/code-login:
    post:
      description: |
        Authenticate with an auth code.
        The returned session is tied to the session that created the auth code,
        and will be expired with any of the creator's sessions.
        This is a subset of an OAuth flow.
      operationId: Auth Code Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCodeLoginArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCodeLoginResult"

  /auth/add-auth:
    post:
      description: |
        Add an authentication method (email/phone + password, SSO, or wallet)
        to the calling user. Subject to the account action rate limit.
      operationId: Auth Add Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAuthArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddAuthResult"

  /auth/remove-auth:
    post:
      description: |
        Remove an authentication method from the calling user. The last
        remaining method cannot be removed.
      operationId: Auth Remove Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveAuthArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveAuthResult"

  /auth/generate-seedphrase:
    post:
      description: |
        Generate a recovery seedphrase for the calling user. Fails if a
        seedphrase auth already exists; see /auth/regenerate-seedphrase.
      operationId: Auth Generate Seedphrase
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSeedphraseResult"

  /auth/regenerate-seedphrase:
    post:
      description: |
        Replace the calling user's recovery seedphrase with a new one,
        invalidating the previous seedphrase.
      operationId: Auth Regenerate Seedphrase
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateSeedphraseResult"

  /network/auth-client:
    post:
      description: |
        Gain permission to use the `connect` protocol as the requested clientId,
        or assign a new clientId.
        Each network can have at most 128 clientIds.
        Above that number, new clientId requests will error until one or more
        existing clientIds are removed.
      operationId: Auth Network Client
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthNetworkClientArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthNetworkClientResult"

  /network/remove-client:
    post:
      description: |
        Remove a client from the network.
      operationId: Remove Network Client
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveNetworkClientArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveNetworkClientResult"

  /network/clients:
    get:
      description: |
        Get the latest status of all clients on this network.

        Includes:

        - Resident status, which is the platform counterpart
        for the client that handles control commands.
        - Connections, which are transports from the client to the platform.
        Note there can be multiple active connections for a single client.
        - Provide status
      operationId: Network Clients
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkClientsResult"

  /network/peers:
    get:
      description: |
        Fast network peer discovery.

        Lists the currently connected network peers: the top-level clients
        of the network (clients with no source_client_id) and their identity
        metadata (provide modes, principal, roles), plus disconnect markers
        for peers that disconnected within the recent window.

        Allowed for network sessions and top-level client sessions.
        A client session's own client is excluded from the list.
      operationId: Network Peers
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPeersResult"

  /preferences/set-preferences:
    post:
      description: |
        Set account preferences.
      operationId: Preferences Set
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesSetArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesSetResult"

  /preferences:
    get:
      description: |
        Get account preferences.
      operationId: Preferences Get
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesGetResult"

  /feedback/send-feedback:
    post:
      description: |
        Feedback.
      operationId: Feedback Send
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSendArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSendResult"

  /log/{clientId}/upload:
    post:
      description: |
        Upload a log file for the caller, associated with a feedback id.
        The request body is the raw log file content, streamed to storage.
        Note the `{clientId}` path segment is actually the feedback id the log
        is attached to.
      operationId: Log Upload
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: clientId
          schema:
            type: string
          required: true
          description: udid. The feedback id the log file is associated with.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadLogFileResult"

  /network/provider-locations:
    get:
      description: |
        A list of locations and groups where there are at least one active provider
        in good health.
        Note that a location or group will need to be mapped to an actual provider
        using `/network/find-providers`.
      operationId: Network Provider Locations
      security: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindLocationsResult"

  /network/find-provider-locations:
    post:
      description: |
        Search for locations and groups that match a query,
        where there are at least one active provider in good health.
        The match algorithm accounts for typos and misspelling,
        and the tolerance can be tuned in the input.
        Note that a location or group will need to be mapped to an actual provider
        using `/network/find-providers`.
      operationId: Network Find Provider Locations
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindLocationsArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindLocationsResult"

  /network/find-providers2:
    post:
      description: |
        Randomly sample providers for locations, groups, or devices,
        which are active and in good health.
        This allows random iteration by using the exclude input to mark
        visited providers.
      operationId: Network Find Providers 2
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindProviders2Args"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindProviders2Result"

  /network/ranking:
    get:
      description: |
        Get leaderboard ranking of current network. Besides the data
        leaderboard rank, the result carries the network's points leaderboard
        settings (`points_leaderboard_public`, `emoji_tag`) and its points
        ranks (`rank_points`, `rank_blocks`, `rank_streak`; 0 until the
        network has points and a ranking snapshot exists).
      operationId: Network Get Ranking
      security:
        - BearerAuth: []

      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkRankingResult"

  /network/ranking-visibility:
    post:
      description: |
        Allow network to toggle leaderboard ranking visibility
      operationId: Network Ranking Visibility
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNetworkRankingVisibilityArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetNetworkRankingVisibilityResult"

  /network/points-ranking-visibility:
    post:
      description: |
        Opt the network in or out of the public all-time points leaderboard.
        The opt-in only controls whether the network is LISTED; every network
        with points is ranked either way. The network name shows on the listed
        row only when the data leaderboard name visibility
        (/network/ranking-visibility) is also on; the emoji tag always shows.
      operationId: Network Points Ranking Visibility
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNetworkPointsRankingVisibilityArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetNetworkPointsRankingVisibilityResult"

  /network/emoji:
    post:
      description: |
        Set the network's emoji tag: 1 to 6 emoji (each grapheme cluster must
        be a single emoji: pictographs with skin tones, ZWJ sequences, keycaps,
        flags). Letters, digits and punctuation are rejected with the message
        "Use 1 to 6 emoji.". An empty string clears the tag. The tag is shown
        on the points leaderboard row and in the network's own header.
      operationId: Network Set Emoji Tag
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNetworkEmojiTagArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetNetworkEmojiTagResult"

  /network/block-location:
    post:
      description: |
        Block providing to a location
      operationId: Network Block Location
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkBlockLocationArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkBlockLocationResult"

  /network/unblock-location:
    post:
      description: |
        Unblock providing to a location
      operationId: Network Unblock Location
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkUnblockLocationArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkUnblockLocationResult"

  /network/blocked-locations:
    get:
      description: Get list locations to block from providing for the network
      operationId: Network Blocked Locations
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNetworkBlockedLocationsResult"

  /network/reliability:
    get:
      description: Get network reliability stats
      operationId: Network Reliability
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNetworkReliabilityResult"

  /network/user:
    get:
      description: |
        Get the user and configured auth methods for the caller network.
      operationId: Get Network User
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNetworkUserResult"

  /network/user/update:
    post:
      description: |
        Update the caller network's name.
      operationId: Update Network Name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNetworkNameArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNetworkNameResult"

  /wallet/balance:
    get:
      description: |
        Get the balance for the USDC user custody wallet.
        The user custody wallet allows URnetwork to query the balance,
        but the user must take actions against the wallet.
      operationId: Wallet Balance
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalanceResult"

  /wallet/validate-address:
    post:
      description: |
        Validate a USDC wallet address on the user custody wallet chain.
        This can be used to check whether an address can receive
        a transfer out from the user custody wallet.
        Please use this before initiating any transfer out to avoid lost funds.
      operationId: Wallet Validate Address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletValidateAddressArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletValidateAddressResult"

  /wallet/circle-init:
    post:
      description: |
        Initialize the Circle USDC user self custody wallet.
        This starts a process that must be completed by the user.
      operationId: Wallet Circle Init
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletCircleInitResult"

  /wallet/circle-transfer-out:
    post:
      description: |
        Set up a transfer from the Circle USDC user self custody wallet
        to an address.
        This starts a process that must be completed by the user.
      operationId: Wallet Circle Transfer Out
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletCircleTransferOutArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletCircleTransferOutResult"

  /subscription/balance:
    get:
      description: |
        Get the current subscription status and transfer balance.
      operationId: Subscription Balance
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionBalanceResult"

  /subscription/details:
    get:
      description: |
        The "Manage subscription" screen: every store currently billing the
        caller's network, one entry per store, with the window it bought
        (`end_time` is the expiry, or the next renewal date when the store
        renews), the store's auto-renew state and the control that stops it.

        `auto_renew` is true/false when the store answered and null when the
        store lookup failed (best-effort, ~5 s per store; the entry still
        carries the window from our own records). `can_cancel` is true only
        for Stripe, which /subscription/cancel acts on; Apple and Google
        entries carry the store's own subscriptions page in `manage_url` (a
        subscription is cancelled where it is billed); a Solana entry is a
        one-time USDC payment that never renews. `has_stripe_customer` gates
        the Stripe billing portal (/stripe/customer-portal errors without one).

        The result is cached per network for 60 seconds; cancel and resume
        invalidate it.
      operationId: Subscription Details
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetailsResult"

  /subscription/cancel:
    post:
      description: |
        Stop the Stripe subscription billing the caller's network at the end of
        the paid period (`cancel_at_period_end`); the customer keeps Pro until
        `end_time`. Only `store` "stripe" (the default) is acted on: the other
        stores answer with `error.message` and, for Apple/Google, the store's
        subscriptions page in `manage_url`. Idempotent: an already-cancelling
        subscription is not written again.
      operationId: Subscription Cancel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCancelArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancelResult"

  /subscription/resume:
    post:
      description: |
        Undo /subscription/cancel while the paid period is still running: the
        Stripe subscription renews again. Same request and result shapes.
      operationId: Subscription Resume
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCancelArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancelResult"

  /subscription/check-balance-code:
    post:
      description: |
        Check if the balance code is valid.
      operationId: Subscription Check Balance Code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCheckBalanceCodeArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckBalanceCodeResult"

  /subscription/redeem-balance-code:
    post:
