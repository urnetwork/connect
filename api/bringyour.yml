      responses:
        "303":
          description: Redirect to the SSO start URL.
          headers:
            Location:
              schema:
                type: string
    post:
      description: |
        Redirect (303) to the single sign-on (SSO) start URL.
        Used to begin the browser SSO/OAuth flow.
      operationId: Auth Connect Post
      security: []
      responses:
        "303":
          description: Redirect to the SSO start URL.
          headers:
            Location:
              schema:
                type: string

  /connect/control:
    post:
      description: |
        Out-of-band control messages for the connect protocol.
        Blocking request-response control messages need to be handled out-of-band
        to resolve the possibility of dedlocks in the client sequence.
      operationId: Connect Control
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectControlArgs"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectControlResult"

