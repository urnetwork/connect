# Lint configuration for bringyour.yml.
#
# The recommended ruleset is kept as-is apart from one rule that describes a
# house style this document does not follow:
#
#   operation-summary -- this document carries its prose in `description`, and
#     only some operations add a `summary` on top of it. Requiring a summary
#     everywhere would mean inventing over a hundred one-liners that repeat
#     the first line of each description.
#
# Everything else, including every structural rule, is enforced. Run:
#   npx -y @redocly/cli lint bringyour.yml
#
# A rule of our own for operations, so the document stays usable by client and
# agent-tool generators:
#
#   rule/operation-id-camel-case -- an operationId is lowerCamelCase
#     ("authLogin"). The sdk's JS generator (sdk js/gen_openapi.go
#     methodName) turns an operationId into a client method name; a renamed
#     id must normalize to the same method name, or the generated client
#     changes.
#
# Rules of our own for descriptions, which every renderer reads as CommonMark
# (ur.io's API reference, Redoc, GitHub). A description whose backticks pair
# up is checked outside its code spans and code blocks:
#
#   rule/description-wildcards-as-code -- a wildcard name such as `weight_*`
#     or `email.*` is written as code. Bare, its `*` reads as an emphasis
#     marker: "(weight_*, tier_*)" renders "tier_" in italics.
#
#   rule/description-placeholders-as-code -- a placeholder such as `<name>`
#     is written as code. Bare, it reads as an HTML tag, which renderers drop:
#     "https://<proxy_host>:<https_proxy_port>" renders "https://:".
extends:
  - recommended

rules:
  operation-summary: off
  rule/operation-id-camel-case:
    subject:
      type: Operation
      property: operationId
    assertions:
      casing: camelCase
    message: Write the operationId in lowerCamelCase, normalizing to the sdk client's existing method name.
    severity: error
  rule/description-wildcards-as-code:
    subject:
      type: any
      property: description
    assertions:
      notPattern: '/^(?:[^`]*`[^`]*`)*[^`]*?[A-Za-z][\w.]*[._]\*/'
    message: Write a wildcard name such as `weight_*` as code, or its `*` reads as emphasis.
    severity: error
  rule/description-placeholders-as-code:
    subject:
      type: any
      property: description
    assertions:
      notPattern: '/^(?:[^`]*`[^`]*`)*[^`]*?<[a-z][a-z0-9_]*>/'
    message: Write a placeholder such as `<name>` as code, or it reads as an HTML tag and is dropped.
    severity: error

apis:
  bringyour:
    root: bringyour.yml
