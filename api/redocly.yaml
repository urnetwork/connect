# Lint configuration for bringyour.yml.
#
# The recommended ruleset is kept as-is, including every structural rule. Run:
#   npx -y @redocly/cli lint bringyour.yml
#
# Its operation-summary rule keeps the operations readable: Redoc and ur.io's
# api.md title an operation by its `summary` and fall back to the operationId,
# so an operation without one would be listed as "statsLast90". The older
# operations' summaries are their names from before the camelCase rename
# ("Stats Last 90"); the prose stays in `description`.
#
# Rules of our own for operations, so the document stays usable by client and
# agent-tool generators and agrees with the ur.io API reference:
#
#   rule/operation-id-camel-case -- an operationId is lowerCamelCase
#     ("authLogin"). The sdk's JS generator (sdk js/gen_openapi.go
#     methodName) turns an operationId into a client method name; a renamed
#     id must normalize to the same method name, or the generated client
#     changes.
#
#   rule/operation-one-tag, operation-singular-tag, operation-tag-defined --
#     every operation has exactly one tag, one of the groups under `tags`.
#     The groups are the ur.io API reference's, which files an operation
#     under its first path segment (a known group, else Other).
#
#   rule/internal-scheme-is-x-internal -- an operation secured by an internal
#     scheme (AdminBearerAuth, OperatorSecret, BrevoWebhookAuth) is marked
#     `x-internal: true`, which keeps it out of the public API reference.
#     Webhooks and operator-only routes without one of those schemes are
#     marked by hand.
#
# Rules of our own for descriptions, which every renderer reads as CommonMark
# (ur.io's API reference, Redoc, GitHub). The first two check a description
# whose backticks pair up outside its code spans and code blocks:
#
#   rule/description-wildcards-as-code -- a wildcard name such as `weight_*`
#     or `email.*` is written as code. Bare, its `*` reads as an emphasis
#     marker: "(weight_*, tier_*)" renders "tier_" in italics.
#
#   rule/description-placeholders-as-code -- a placeholder such as `<name>`
#     is written as code. Bare, it reads as an HTML tag, which renderers drop:
#     "https://<proxy_host>:<https_proxy_port>" renders "https://:".
#
#   rule/description-no-deployment-files -- a description does not name the
#     deployment's vault or config files (`pro.yml`); it says what is
#     configured instead. The cross-reference to the competition spec,
#     `sn/api/competition.yml`, is the one yml name allowed.
extends:
  - recommended

rules:
  operation-singular-tag: error
  operation-tag-defined: error
  rule/operation-id-camel-case:
    subject:
      type: Operation
      property: operationId
    assertions:
      casing: camelCase
    message: Write the operationId in lowerCamelCase, normalizing to the sdk client's existing method name.
    severity: error
  rule/operation-one-tag:
    subject:
      type: Operation
      property: tags
    assertions:
      defined: true
      minLength: 1
    message: Tag the operation with its ur.io API reference group.
    severity: error
  rule/internal-scheme-is-x-internal:
    subject:
      type: SecurityRequirement
    where:
      - subject:
          type: Operation
          property: x-internal
        assertions:
          defined: false
    assertions:
      disallowed:
        - AdminBearerAuth
        - OperatorSecret
        - BrevoWebhookAuth
    message: "Mark an operation secured by an internal scheme `x-internal: true`."
    severity: error
  rule/description-wildcards-as-code:
    subject:
      type: any
      property: description
    assertions:
      notPattern: '/^(?:[^`]*`[^`]*`)*[^`]*?[A-Za-z][\w.]*[._]\*/'
    message: Write a wildcard name such as `weight_*` as code, or its `*` reads as emphasis.
    severity: error
  rule/description-placeholders-as-code:
    subject:
      type: any
      property: description
    assertions:
      notPattern: '/^(?:[^`]*`[^`]*`)*[^`]*?<[a-z][a-z0-9_]*>/'
    message: Write a placeholder such as `<name>` as code, or it reads as an HTML tag and is dropped.
    severity: error
  rule/description-no-deployment-files:
    subject:
      type: any
      property: description
    assertions:
      notPattern: '/(?<!sn\/api\/)\b[\w-]+\.ya?ml\b/'
    message: Do not name a deployment vault or config file; say what is configured.
    severity: error

apis:
  bringyour:
    root: bringyour.yml
