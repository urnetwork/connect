# Lint configuration for bringyour.yml.
#
# The recommended ruleset is kept as-is apart from two rules that describe a
# house style this document does not follow, and that cannot be changed
# without breaking consumers or rewriting the whole file:
#
#   operation-operationId-url-safe -- most operationIds here are human-readable
#     phrases with spaces ("Auth Login"). They are part of the published
#     contract that client generators key off, so renaming them is a breaking
#     change, not a lint fix. New operations use camelCase; the old names stay.
#
#   operation-summary -- this document carries its prose in `description`, and
#     only the newer tagged operations add a `summary` on top of it. Requiring
#     a summary everywhere would mean inventing 120 one-liners that repeat the
#     first line of each description.
#
# Everything else, including every structural rule, is enforced. Run:
#   npx -y @redocly/cli lint bringyour.yml
#
# Two rules of our own, for descriptions, which every renderer reads as
# CommonMark (ur.io's API reference, Redoc, GitHub). A description whose
# backticks pair up is checked outside its code spans and code blocks:
#
#   rule/description-wildcards-as-code -- a wildcard name such as `weight_*`
#     or `email.*` is written as code. Bare, its `*` reads as an emphasis
#     marker: "(weight_*, tier_*)" renders "tier_" in italics.
#
#   rule/description-placeholders-as-code -- a placeholder such as `<name>`
#     is written as code. Bare, it reads as an HTML tag, which renderers drop:
#     "https://<proxy_host>:<https_proxy_port>" renders "https://:".
extends:
  - recommended

rules:
  operation-operationId-url-safe: off
  operation-summary: off
  rule/description-wildcards-as-code:
    subject:
      type: any
      property: description
    assertions:
      notPattern: '/^(?:[^`]*`[^`]*`)*[^`]*?[A-Za-z][\w.]*[._]\*/'
    message: Write a wildcard name such as `weight_*` as code, or its `*` reads as emphasis.
    severity: error
  rule/description-placeholders-as-code:
    subject:
      type: any
      property: description
    assertions:
      notPattern: '/^(?:[^`]*`[^`]*`)*[^`]*?<[a-z][a-z0-9_]*>/'
    message: Write a placeholder such as `<name>` as code, or it reads as an HTML tag and is dropped.
    severity: error

apis:
  bringyour:
    root: bringyour.yml
