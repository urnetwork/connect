syntax = "proto3";
package bringyour;

option go_package = "github.com/urnetwork/connect/protocol";


message ExtenderHeader {
    string DestinationHost = 1;
    uint32 DestinationPort = 2;
    uint64 Timestamp = 3;
    bytes Nonce = 4;
    bytes Signature = 5;
    // 32 random bytes set by a prober; the response carries the signature over it
    bytes Challenge = 6;
    // 0 forward, 1 gossip, 2 feed, 3 probe
    uint32 Service = 7;
    // Relay DATAGRAMS to the destination instead of a stream.
    //
    // The carrier is still one reliable byte stream; each datagram is carried
    // on it with a two byte big endian length prefix, and the extender turns
    // those frames back into real udp packets at the far end. It exists for
    // quic: an extender cannot decode the inner tls, so it cannot reframe a
    // quic stream into anything, and without this a client pinned to an h3
    // carrier has no extender path at all.
    //
    // Datagram boundaries are preserved, and ONLY the boundaries. The carrier
    // is reliable and ordered, so a datagram cannot be lost or reordered
    // between client and extender the way a real udp path would allow, and
    // loss past the extender is not signalled. Quic tolerates both: it is
    // carrying its own loss recovery, and a reliable underlay simply never
    // exercises it on that leg.
    bool Datagram = 8;
    // Probe only. The 16 byte client id of a PROVIDER that will attest its
    // measured rtt; its presence asks the extender for a ProbeNonce. A client
    // that only ranks by latency leaves it empty and identifies itself to the
    // extender no more than a forward does.
    bytes ProbeClientId = 9;
    // Probe only. The 32 byte identity key of an EXTENDER that will attest
    // its measured rtt to a peer (GEOMAP §2.2), which asks for a ProbeNonce
    // exactly as ProbeClientId does. At most one of the two is set; a header
    // with both is refused.
    bytes ProbeExtenderPublicKey = 10;
    // How many extenders this request has already crossed: 0 from a client,
    // and one more on every header an NLayer extender sends to its next layer
    // (EXTENDER.md A11). An extender refuses a request that would make it
    // deeper than its bound, which is what ends a chain that loops.
    uint32 HopCount = 11;
}

message ExtenderResponse {
    // the extender identity key, empty when the extender has none
    bytes PublicKey = 1;
    // over "ur-extender-challenge-v1" || Challenge, empty when no challenge was sent
    bytes ChallengeSignature = 2;
    // tcp, quic, dns
    repeated string Carriers = 3;
    // Probe only, when ProbeClientId or ProbeExtenderPublicKey was set: a
    // short lived nonce the attestation must echo. Fresh random bytes held
    // for the life of the stream, so the extender keeps no per probe state.
    bytes ProbeNonce = 4;
    // Probe only. The HopCount of the header the extender that answered the
    // probe itself received: 0 for a direct probe, the depth of the chain's
    // end for a probe an NLayer extender relayed (GEOMAP §2.9). Set by the
    // end and copied back by every relay.
    uint32 HopCount = 5;
    // Probe only. The identity key of the end of the chain a relayed probe
    // was answered by, which is the key the attestation names and the
    // verdict is co-signed under; empty for a direct probe (GEOMAP §2.9).
    bytes ChainEndPublicKey = 6;
}

// Sent by an attesting pinger -- a provider or an extender -- as one length
// prefixed frame after the ExtenderResponse, on the same stream. The rtt is
// the PINGER's own measurement under the pinger's signature: the target
// compares it with the interval it observed and accepts or refuses it in an
// ExtenderProbeVerdict, but it cannot change the number. Exactly one of
// ProbeClientId and PingerExtenderPublicKey is set.
message ExtenderProbeAttestation {
    // the provider's client id, empty for an extender pinger
    bytes ProbeClientId = 1;
    // binds the claim to the extender it was measured against
    bytes ExtenderPublicKey = 2;
    // echoed from the response
    bytes ProbeNonce = 3;
    uint32 RttMs = 4;
    uint64 TimestampMs = 5;
    // ed25519 over fixed width signing bytes: by the provider client key
    // under "ur-extender-probe-v1" with the client id, or by the pinging
    // extender's identity key under "ur-extender-peer-probe-v1" with its key
    // in the client id's place (GEOMAP §2.2)
    bytes Signature = 6;
    // the pinging extender's identity key, empty for a provider pinger
    bytes PingerExtenderPublicKey = 7;
}

// The target's answer to an attestation, one length prefixed frame on the
// same stream, written whether it accepts or refuses (GEOMAP §2.3). A pinger
// that reads none -- an old target, a close, a timeout -- records the ping as
// unknown.
message ExtenderProbeVerdict {
    bool Accepted = 1;
    // 0 ok; 1 rtt below observed; 2 nonce; 3 wrong extender; 4 unknown
    // pinger; 5 bad signature; 6 rate limited
    uint32 Reason = 2;
    // Accepted only. ed25519 by the TARGET's identity key over
    // "ur-extender-probe-cosign-v1" || the attestation's signing bytes
    // (domain included) || the pinger's signature
    bytes Cosignature = 3;
}

message ExtenderAddress {
    string Ip = 1;
    uint32 IpVersion = 2;
    repeated string Carriers = 3;
}

message ExtenderRecordBody {
    bytes PublicKey = 1;
    repeated ExtenderAddress Addresses = 2;
    uint32 TcpPort = 3;
    uint32 UdpPort = 4;
    // the first dns port, kept for readers that predate DnsPorts
    uint32 DnsPort = 5;
    string DnsTld = 6;
    string CountryCode = 7;
    uint64 IssueTimeMs = 8;
    uint64 ExpireTimeMs = 9;
    string NetworkHost = 10;
    // every dns port that passed the activation probe, dialed in ascending
    // order so 53 is tried before 4053
    repeated uint32 DnsPorts = 11;
    // Upper case two letter continent code the operator derived from
    // CountryCode at signing, the same mapping the geo dns uses. Empty on
    // records that predate it.
    string ContinentCode = 12;
}

message ExtenderRecord {
    // serialized ExtenderRecordBody, signed opaquely to avoid serialization ambiguity
    bytes Body = 1;
    // over "ur-extender-record-v1" || Body
    bytes RootSignature = 2;
    // first 8 bytes of sha256 of the signing public key
    bytes RootKeyId = 3;
}

message ExtenderRevocationBody {
    bytes PublicKey = 1;
    uint64 IssueTimeMs = 2;
    string NetworkHost = 3;
}

message ExtenderRevocation {
    // serialized ExtenderRevocationBody
    bytes Body = 1;
    // over "ur-extender-revocation-v1" || Body
    bytes RootSignature = 2;
    bytes RootKeyId = 3;
}

message ExtenderGossipMessage {
    oneof Message {
        ExtenderRecord Record = 1;
        ExtenderRevocation Revocation = 2;
    }
}

message ExtenderFeedRequest {
    uint32 SampleCount = 1;
    bool Subscribe = 2;
}

message ExtenderFeedFrame {
    oneof Frame {
        ExtenderRecord Record = 1;
        ExtenderRevocation Revocation = 2;
        bool EndOfSample = 3;
        bool Keepalive = 4;
    }
}

// The optional operator settings of a share (K7). They are applied only when
// the importer asks for them, since they replace the trust anchor.
message ExtenderShareSettings {
    string DnsName = 1;
    string GossipUrl = 2;
    // ed25519 root public keys, 32 bytes each
    repeated bytes RootPublicKeys = 3;
}

// A shared set of extender addresses (K7). Addresses only: an imported address
// is an unverified bootstrap entry that upgrades when a record arrives.
message ExtenderShare {
    uint32 Version = 1;
    // the network host of the space that produced the share; an import into
    // another space is refused unless the settings are taken with it
    string NetworkHost = 2;
    // 4 or 16 bytes each
    repeated bytes Addresses = 3;
    ExtenderShareSettings Settings = 4;
}
